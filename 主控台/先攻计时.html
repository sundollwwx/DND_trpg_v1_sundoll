<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>先攻计时 · 桑哆尔</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#101218; --panel:#191c25; --panel2:#212531; --border:#2b303d;
  --text:#e8eaf0; --muted:#9aa3b2; --accent:#e0b34c; --danger:#e74c5e;
  --pc:#5b8cff; --enemy:#ef476f; --npc:#f4a261;
}
html, body { height: 100%; }
body {
  display: flex; flex-direction: column;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  background: var(--bg); color: var(--text); overflow: hidden; user-select: none;
}
input, select, button { font: inherit; color: inherit; }
input, select {
  background:#141722; border:1px solid var(--border); border-radius:8px;
  padding:6px 8px; outline:none; min-width:0;
}
input:focus, select:focus { border-color: var(--accent); }
button {
  cursor:pointer; border:1px solid var(--border); background:var(--panel2);
  color:var(--text); border-radius:8px; padding:7px 12px;
  transition:background .15s, filter .15s; white-space:nowrap;
}
button:hover { background:#2b3140; }
button.primary { background:var(--accent); border-color:var(--accent); color:#241d0a; font-weight:600; }
button.primary:hover { background:#f0c45c; }
button.small { padding:3px 8px; font-size:12px; border-radius:7px; }
button.danger { color:var(--danger); }
button.rest { border-color:#4c7a4f; color:#7ecb83; }
header {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--border); z-index:5;
}
.brand { display:flex; align-items:center; gap:8px; font-size:17px; font-weight:700; white-space:nowrap; }
.brand em { color:var(--accent); font-style:normal; }
.bind-campaign { font-size:12px; color:var(--muted); border:1px solid var(--border); border-radius:12px; padding:3px 10px; white-space:nowrap; }
.bind-campaign.campaign-bound { color:var(--accent); border-color:var(--accent); }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.chk { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); }
.chk input { width:auto; }
main { flex:1; min-height:0; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px; }
.card {
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:14px 16px; display:flex; flex-direction:column; gap:10px;
}
.card h2 { font-size:15px; color:var(--accent); display:flex; align-items:center; gap:8px; }

/* 时间条 */
.time-now { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
.time-now .day { font-size:15px; color:var(--text); }
.time-now .clock { font-size:34px; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
.time-now .phase { font-size:14px; color:var(--muted); }
.time-bar {
  position:relative; height:14px; border-radius:8px; overflow:hidden;
  background:linear-gradient(90deg,#1c2030 0%,#2b2733 25%,#3a3226 50%,#2b2733 75%,#1c2030 100%);
  border:1px solid var(--border);
}
.time-bar .time-fill {
  position:absolute; inset:0 auto 0 0; width:0%;
  background:linear-gradient(90deg, rgba(224,179,76,.25), rgba(224,179,76,.9));
  box-shadow:0 0 10px rgba(224,179,76,.55);
}
.time-bar .meal-mark {
  position:absolute; top:1px; transform:translateX(-50%);
  font-size:9px; line-height:1.3; color:rgba(255,255,255,.85);
  background:rgba(0,0,0,.4); border-radius:4px; padding:0 3px; pointer-events:none;
}
#timer-strip { display:flex; flex-direction:column; gap:3px; padding-top:4px; }
#timer-strip .tstrip-row { position:relative; height:8px; border-radius:4px; background:rgba(255,255,255,.06); overflow:hidden; }
#timer-strip .tstrip-seg { position:absolute; top:0; bottom:0; opacity:.8; border-left:1px solid rgba(255,255,255,.55); }
.time-marks { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
.weather-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.weather-now { font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px; }
.weather-btns { display:flex; gap:4px; flex-wrap:wrap; }
.weather-btns button { padding:3px 8px; font-size:12px; border-radius:8px; }
.weather-btns button.active { border-color:var(--accent); box-shadow:0 0 0 1px rgba(224,179,76,.4); }
.timer-section { display:flex; flex-direction:column; gap:8px; border-top:1px solid var(--border); padding-top:10px; }
.timer-head { font-size:12px; color:var(--muted); }
.timer-add { display:flex; gap:8px; flex-wrap:wrap; }
.timer-add input { flex:1 1 100px; }
#timer-name { flex:2 1 140px; }
#timer-list { display:flex; flex-direction:column; gap:4px; max-height:150px; overflow-y:auto; }
.timer-row {
  display:flex; align-items:center; gap:8px; padding:5px 9px;
  border:1px solid var(--border); border-radius:9px; background:var(--panel2); font-size:13px;
}
.timer-row .tdot { width:10px; height:10px; border-radius:50%; flex:none; }
.timer-row .tname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.timer-row .tleft { color:var(--muted); white-space:nowrap; font-size:12px; }
.timer-row.expired { opacity:.45; }
.links-card h2 { cursor: pointer; }
.links-card.collapsed > *:not(h2) { display: none; }
.links-list { display:flex; flex-direction:column; gap:4px; }
.link-row {
  display:flex; align-items:center; gap:8px; padding:5px 9px;
  border:1px solid var(--border); border-radius:9px; background:var(--panel2); font-size:13px;
}
.link-row a { flex:1; min-width:0; color:var(--text); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.link-row a:hover { color:var(--accent); }
.links-add { display:flex; gap:6px; }
.links-add input { flex:1; min-width:0; padding:5px 8px; }
.time-groups { display:flex; flex-direction:column; gap:6px; border-top:1px solid var(--border); padding-top:10px; }
.time-group { display:flex; align-items:center; gap:8px; }
.tg-label { width:52px; flex:none; font-size:12px; color:var(--muted); }
.tg-btns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.tg-btns input { width:80px; }
.tg-btns select { width:auto; }
.rest-progress {
  height:16px; border-radius:8px; overflow:hidden;
  background:#141722; border:1px solid var(--border);
}
.rest-progress .fill {
  height:100%; width:0%;
  background:linear-gradient(90deg,#7ecb83,#e0b34c);
  box-shadow:0 0 10px rgba(126,203,131,.45);
  transition:width .05s linear;
}

/* 先攻列表 */
.add-row { display:flex; gap:8px; flex-wrap:wrap; }
.add-row input { flex:0 1 120px; }
.add-row #in-name { flex:2 1 160px; }
.init-controls { display:flex; align-items:center; gap:10px; justify-content:space-between; }
#round-tag { font-size:13px; color:var(--muted); font-weight:400; margin-left:auto; }
#current-hint { font-size:13px; color:var(--muted); }
#init-list { display:flex; flex-direction:column; gap:5px; max-height:46vh; overflow-y:auto; }
.init-row {
  display:flex; align-items:center; gap:8px; padding:6px 10px;
  border:1px solid var(--border); border-radius:10px; background:var(--panel2);
}
.init-row.current { border-color:var(--accent); box-shadow:0 0 0 1px rgba(224,179,76,.35); background:#23202a; }
.init-row .mark { width:16px; text-align:center; color:var(--accent); font-size:12px; }
.init-row .dot { width:10px; height:10px; border-radius:50%; flex:none; border:1px solid rgba(255,255,255,.25); }
.init-row .pname { flex:1 1 130px; min-width:0; }
.init-row input {
  width:62px; padding:4px 6px; font-size:13px; text-align:center;
}
.init-row input.pname-input { width:100%; text-align:left; }
.init-row .hp-box { display:flex; align-items:center; gap:4px; color:var(--muted); font-size:12px; white-space:nowrap; }
.init-row .hp-box input { width:52px; }
.init-row .skip { display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted); white-space:nowrap; }
.init-row .skip input { width:auto; }
.init-row.skipped { opacity:.45; }

/* 棋子库弹窗 */
.mask {
  position:fixed; inset:0; background:rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center; z-index:100;
}
.mask[hidden] { display:none; }
.modal {
  width:min(560px, 92vw); max-height:80vh; background:var(--panel);
  border:1px solid var(--border); border-radius:14px; padding:16px;
  display:flex; flex-direction:column; gap:10px;
}
.modal h2 { font-size:15px; color:var(--accent); }
#lib-search { width:100%; }
#lib-pick-list { overflow-y:auto; display:flex; flex-direction:column; gap:4px; }
.lib-item {
  display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:9px;
  border:1px solid transparent; cursor:pointer;
}
.lib-item:hover { background:var(--panel2); border-color:var(--border); }
.lib-item .thumb {
  width:34px; height:34px; border-radius:50%; flex:none; display:flex; align-items:center;
  justify-content:center; font-size:17px; background:#fff; background-size:cover; background-position:center;
}
.lib-item .meta { min-width:0; }
.lib-item .meta .n { font-size:14px; }
.lib-item .meta .c { font-size:11px; color:var(--muted); }
.lib-item .stat { margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap; }

#toast {
  position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
  background:#232838; border:1px solid var(--border); border-radius:10px;
  padding:9px 16px; font-size:14px; box-shadow:0 8px 28px rgba(0,0,0,.5); z-index:120;
}
#toast[hidden] { display:none; }
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background:#333947; border-radius:8px; }
</style>
</head>
<body>
<header>
  <div class="brand">⏱️ 先攻计时 <em>桑哆尔</em></div>
  <span id="bind-campaign" class="bind-campaign">临时战役</span>
  <div class="controls">
    <label class="chk"><input type="checkbox" id="auto-time"> 每回合自动 +6 秒</label>
    <button id="btn-export">⬇ 导出</button>
    <button id="btn-import">⬆ 导入</button>
    <input type="file" id="file-import" accept=".json,application/json" hidden>
    <button id="btn-reset">重置</button>
  </div>
</header>

<main>
  <section class="card">
    <h2>📅 时间条</h2>
    <div class="time-now">
      <span class="day" id="time-day">第 1 天</span>
      <span class="clock" id="time-clock">08:00</span>
      <span class="phase" id="time-phase">☀️ 上午</span>
    </div>
    <div class="time-bar">
      <div class="time-fill" id="time-fill"></div>
      <span class="meal-mark" style="left:33.33%">早餐</span>
      <span class="meal-mark" style="left:50%">午餐</span>
      <span class="meal-mark" style="left:75%">晚餐</span>
    </div>
    <div id="timer-strip"></div>
    <div class="time-marks"><span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span></div>
    <div class="weather-row">
      <span class="weather-now" id="weather-now">☀️ 晴朗</span>
      <button id="btn-weather-random" class="small">🎲 随机</button>
      <span class="weather-btns" id="weather-btns"></span>
    </div>
    <div class="timer-section">
      <div class="timer-head">⏳ 限时条（时间走完自动消失，点 × 直接删除）</div>
      <div class="timer-add">
        <input id="timer-name" placeholder="名称（如：黑暗术）">
        <input id="timer-min" type="number" min="1" value="10" placeholder="时长">
        <select id="timer-unit">
          <option value="min">分钟</option>
          <option value="hour">小时</option>
          <option value="round">回合（6秒）</option>
        </select>
        <button id="btn-timer-add" class="primary">＋ 限时条</button>
      </div>
      <div id="timer-list"></div>
    </div>
    <div class="time-groups">
      <div class="time-group"><span class="tg-label">时刻</span><span class="tg-btns">
        <button data-min="0.1">+6秒</button>
        <button data-min="1">+1分</button>
        <button data-min="10">+10分</button>
        <button data-min="60">+1小时</button>
      </span></div>
      <div class="time-group"><span class="tg-label">回退</span><span class="tg-btns">
        <button data-min="-0.1">-6秒</button>
        <button data-min="-1">-1分</button>
        <button data-min="-10">-10分</button>
        <button data-min="-60">-1小时</button>
      </span></div>
      <div class="time-group"><span class="tg-label">饭点</span><span class="tg-btns">
        <button data-set="480">早餐 08:00</button>
        <button data-set="720">午餐 12:00</button>
        <button data-set="1080">晚餐 18:00</button>
      </span></div>
      <div class="time-group"><span class="tg-label">休息</span><span class="tg-btns">
        <button data-rest="60" class="rest">短休 1小时</button>
        <button data-rest="480" class="rest">长休 8小时</button>
      </span></div>
      <div class="time-group"><span class="tg-label">自定义</span><span class="tg-btns">
        <input id="custom-num" type="number" min="-1440" value="30">
        <select id="custom-unit">
          <option value="min">分钟</option>
          <option value="hour">小时</option>
          <option value="round">回合（6秒）</option>
        </select>
        <button id="btn-custom-add">＋ 添加</button>
      </span></div>
    </div>
  </section>

  <section class="card">
    <h2>⚔️ 先攻列表 <span id="round-tag">第 1 回合</span></h2>
    <div class="add-row">
      <input id="in-name" placeholder="名称">
      <input id="in-init" type="number" placeholder="先攻">
      <input id="in-hp" type="number" placeholder="HP">
      <input id="in-ac" type="number" placeholder="AC">
      <select id="in-type" title="类型颜色">
        <option value="enemy">敌人</option>
        <option value="pc">玩家</option>
        <option value="npc">中立NPC</option>
        <option value="ally">友好NPC</option>
      </select>
      <button id="btn-add" class="primary">＋ 添加</button>
      <button id="btn-lib">📚 从棋子库</button>
    </div>
    <div id="init-list"></div>
    <div class="init-controls">
      <button id="btn-prev">◀ 上一名</button>
      <span id="current-hint">方向键 ← → 也能切换</span>
      <button id="btn-next" class="primary">下一名 ▶</button>
    </div>
  </section>

  <section class="card links-card collapsed" id="links-card">
    <h2>📚 常用网站</h2>
    <div id="links-list" class="links-list"></div>
    <div class="links-add">
      <input id="link-name" placeholder="名称">
      <input id="link-url" placeholder="https://…">
      <button id="btn-link-add" class="small primary">＋</button>
    </div>
  </section>
</main>

<div id="lib-modal" class="mask" hidden>
  <div class="modal">
    <h2>📚 从棋子库添加（点击添加）</h2>
    <input id="lib-search" placeholder="搜索棋子…">
    <div id="lib-pick-list"></div>
    <div style="display:flex; justify-content:flex-end;"><button id="btn-lib-close">关闭</button></div>
  </div>
</div>

<div id="rest-modal" class="mask" hidden>
  <div class="modal" style="width:min(380px,90vw);">
    <h2 id="rest-title">短休中…</h2>
    <div class="rest-progress"><div class="fill" id="rest-fill"></div></div>
    <div style="color:var(--muted); font-size:13px; text-align:center;" id="rest-hint">休息完成后时间自动推进</div>
  </div>
</div>

<div id="toast" hidden></div>

<script src="../棋子库/棋子库数据.js"></script>
<script>
'use strict';

const DEFAULT_STORE_KEY = 'sangduoer-init-time-v1';
const LIBRARY_KEY = 'dnd-board-library-v1';
const TYPE_COLOR = { pc: '#5b8cff', enemy: '#ef476f', npc: '#f4a261', ally: '#2ecc71' };
const PHASES = [
  { from: 0,  label: '🌙 深夜', color: '#6b7482' },
  { from: 5,  label: '🌅 黎明', color: '#f4a261' },
  { from: 8,  label: '☀️ 上午', color: '#e0b34c' },
  { from: 12, label: '☀️ 午后', color: '#f9d47c' },
  { from: 17, label: '🌇 黄昏', color: '#ff8a5c' },
  { from: 19, label: '🌙 夜晚', color: '#8e7cc3' },
];

let state = {
  participants: [],
  timers: [],
  weather: {},
  round: 1,
  current: -1,
  autoTime: true,
  time: { day: 1, minutes: 8 * 60 },
};
let uid = 1;
let toastTimer = null;
let resting = false;
const TIMER_COLORS = ['#5b8cff', '#ef476f', '#f4a261', '#2ecc71', '#b388ff', '#4cc9f0', '#ff7ab8', '#ff8a5c'];
const WEATHERS = [
  { key: 'sunny',    name: '晴朗', emoji: '☀️', color: '#f9d47c' },
  { key: 'cloudy',   name: '多云', emoji: '⛅', color: '#c8d0e0' },
  { key: 'overcast', name: '阴天', emoji: '☁️', color: '#9aa3b2' },
  { key: 'drizzle',  name: '小雨', emoji: '🌦️', color: '#7fb3d5' },
  { key: 'rain',     name: '大雨', emoji: '🌧️', color: '#5b8cff' },
  { key: 'storm',    name: '雷暴', emoji: '⛈️', color: '#8e7cc3' },
  { key: 'snow',     name: '下雪', emoji: '❄️', color: '#b9c6dc' },
  { key: 'fog',      name: '浓雾', emoji: '🌫️', color: '#9aa3b2' },
  { key: 'windy',    name: '大风', emoji: '💨', color: '#7ecb83' },
];
const WEATHER_WEIGHTS = [30, 25, 15, 10, 8, 4, 3, 3, 2];

const $ = (s) => document.querySelector(s);

function abilityMod(v) { return Math.floor(((v || 10) - 10) / 2); }

function loadLibrary() {
  try {
    const raw = localStorage.getItem(LIBRARY_KEY);
    const arr = raw ? JSON.parse(raw) : [];
    if (Array.isArray(arr) && arr.length) return arr;
  } catch (e) { /* 忽略 */ }
  return Array.isArray(window.__LIBRARY_FILE__) ? window.__LIBRARY_FILE__ : [];
}

// 与主控台战役绑定：主控台当前战役不同，先攻计时数据自动分战役保存
function currentCampaignInfo() {
  try {
    const raw = localStorage.getItem('dnd-board-state-v1');
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (s && s.campaignId) return { id: s.campaignId, name: s.campaignName || '未命名战役' };
  } catch (e) { /* 忽略 */ }
  return null;
}

function currentStoreKey() {
  const c = currentCampaignInfo();
  return c ? 'sangduoer-init-time-' + c.id : DEFAULT_STORE_KEY;
}

let boundCampaignId = '__init__';

function bindCampaign() {
  const c = currentCampaignInfo();
  const changed = boundCampaignId !== (c ? c.id : null);
  boundCampaignId = c ? c.id : null;
  const el = $('#bind-campaign');
  if (el) {
    el.textContent = c ? '当前战役：' + c.name : '临时战役';
    el.classList.toggle('campaign-bound', !!c);
  }
  if (changed) {
    load();
    renderAll();
    if (boundCampaignId) toast('已切换到战役：' + c.name);
  }
}

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

/* ==================== 时间条 ==================== */

function formatClock(min) {
  const total = Math.max(0, Math.floor(min));
  const hh = String(Math.floor(total / 60) % 24).padStart(2, '0');
  const mm = String(total % 60).padStart(2, '0');
  const sec = Math.floor(((min < 0 ? 0 : min) % 1) * 60);
  return sec > 0 ? hh + ':' + mm + ':' + String(sec).padStart(2, '0') : hh + ':' + mm;
}

function phaseOf(min) {
  const h = Math.floor(min / 60) % 24;
  let p = PHASES[0];
  for (const ph of PHASES) if (h >= ph.from) p = ph;
  return p;
}

function renderTime() {
  const t = state.time;
  const year = Math.floor((t.day - 1) / 364) + 1;
  const rest = (t.day - 1) % 364;
  const week = Math.floor(rest / 7) + 1;
  const dayInWeek = (rest % 7) + 1;
  $('#time-day').textContent = `第 ${year} 年 · 第 ${week} 周 · 第 ${dayInWeek} 天`;
  $('#time-clock').textContent = formatClock(t.minutes);
  const p = phaseOf(t.minutes);
  $('#time-phase').textContent = p.label;
  $('#time-phase').style.color = p.color;
  $('#time-fill').style.width = (Math.min(100, (t.minutes % 1440) / 1440 * 100)) + '%';
  renderTimers();
  renderWeather();
}

function rollWeather() {
  const r = Math.random() * 100;
  let acc = 0;
  for (let i = 0; i < WEATHERS.length; i++) {
    acc += WEATHER_WEIGHTS[i];
    if (r <= acc) return WEATHERS[i].key;
  }
  return 'sunny';
}

function renderWeather() {
  const d = state.time.day;
  if (!state.weather[d]) { state.weather[d] = rollWeather(); save(); }
  const w = WEATHERS.find((x) => x.key === state.weather[d]) || WEATHERS[0];
  const now = $('#weather-now');
  now.textContent = w.emoji + ' ' + w.name;
  now.style.color = w.color;
  const box = $('#weather-btns');
  box.innerHTML = '';
  WEATHERS.forEach((x) => {
    const b = document.createElement('button');
    b.className = 'small' + (x.key === w.key ? ' active' : '');
    b.dataset.weather = x.key;
    b.textContent = x.emoji + ' ' + x.name;
    b.title = x.name;
    box.appendChild(b);
  });
}

function addMinutes(v) {
  if (!v) return;
  const t = state.time;
  t.minutes += v;
  if (t.minutes < 0) {
    const daysBack = Math.floor(-t.minutes / 1440) + 1;
    t.day -= daysBack;
    t.minutes += daysBack * 1440;
    if (t.day < 1) { t.day = 1; t.minutes = 0; }
  } else if (t.minutes >= 1440) {
    const days = Math.floor(t.minutes / 1440);
    t.day += days;
    t.minutes -= days * 1440;
  }
  renderTime();
  save();
}

function epochMin() {
  return (state.time.day - 1) * 1440 + state.time.minutes;
}

function fmtRemain(min) {
  min = Math.max(0, min);
  if (min < 1) return Math.ceil(min * 60) + '秒';
  min = Math.ceil(min);
  if (min >= 1440) {
    const d = Math.floor(min / 1440);
    const h = Math.floor((min % 1440) / 60);
    return d + '天' + (h ? h + '小时' : '');
  }
  if (min >= 60) {
    const h = Math.floor(min / 60);
    const m = min % 60;
    return h + '小时' + (m ? m + '分' : '');
  }
  return min + '分钟';
}

function addTimer(name, durationMin) {
  const n = (name || '').trim() || '限时';
  if (!(durationMin > 0)) return;
  state.timers.push({
    id: 'tm' + (uid++),
    name: n,
    color: TIMER_COLORS[state.timers.length % TIMER_COLORS.length],
    startMin: epochMin(),
    durationMin,
  });
  renderTimers();
  save();
  toast(`已添加限时条「${n}」（${fmtRemain(durationMin)}）`);
}

// 移除已到期的限时条，返回是否有到期
function pruneTimers() {
  const now = epochMin();
  const expired = state.timers.filter((t) => now >= t.startMin + t.durationMin);
  if (!expired.length) return false;
  state.timers = state.timers.filter((t) => now < t.startMin + t.durationMin);
  toast('⏳ 限时结束：' + expired.map((t) => t.name).join('、'));
  return true;
}

function renderTimers() {
  pruneTimers();
  const now = epochMin();
  const strip = $('#timer-strip');
  strip.innerHTML = '';
  const list = $('#timer-list');
  list.innerHTML = '';
  state.timers.forEach((t) => {
    const endMin = t.startMin + t.durationMin;
    const left = ((t.startMin % 1440) / 1440) * 100;
    const right = ((endMin % 1440) / 1440) * 100;
    const width = Math.max(0.4, Math.min(100 - left, (right > left ? right : 100) - left));
    const row = document.createElement('div');
    row.className = 'tstrip-row';
    row.title = t.name + ' · 剩余 ' + fmtRemain(endMin - now);
    const seg = document.createElement('span');
    seg.className = 'tstrip-seg';
    seg.style.left = left + '%';
    seg.style.width = width + '%';
    seg.style.background = t.color;
    row.appendChild(seg);
    strip.appendChild(row);

    const endDay = Math.floor(endMin / 1440) + 1;
    const sameDay = endDay === state.time.day;
    const lrow = document.createElement('div');
    lrow.className = 'timer-row' + (now >= endMin ? ' expired' : '');
    lrow.innerHTML =
      `<span class="tdot" style="background:${t.color};"></span>` +
      `<span class="tname">${esc(t.name)}</span>` +
      `<span class="tleft">剩余 ${fmtRemain(endMin - now)} · 至 ${sameDay ? formatClock(endMin % 1440) : '第' + endDay + '天 ' + formatClock(endMin % 1440)}</span>` +
      `<button class="small danger" data-del="${t.id}" title="删除">×</button>`;
    list.appendChild(lrow);
  });
  if (!state.timers.length) {
    list.innerHTML = '<div style="color:var(--muted);font-size:12px;">还没有限时条，比如法术/状态持续时间，加一个试试。</div>';
  }
}

// 短休 / 长休：先走一段进度动画，走完再把时间加上
function startRest(min, label) {
  if (resting) return;
  resting = true;
  const dur = min >= 480 ? 8000 : 3000; // 长休 8 秒、短休 3 秒（现实时间）
  const modal = $('#rest-modal');
  const fill = $('#rest-fill');
  $('#rest-title').textContent = label;
  $('#rest-hint').textContent = '休息完成时间：' + formatClock(state.time.minutes + min);
  fill.style.width = '0%';
  modal.hidden = false;
  const t0 = performance.now();
  const iv = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / dur);
    fill.style.width = (p * 100) + '%';
    if (p >= 1) {
      clearInterval(iv);
      modal.hidden = true;
      resting = false;
      addMinutes(min);
      toast((min >= 480 ? '长休' : '短休') + '完成，时间 +' + (min >= 480 ? '8 小时' : '1 小时'));
    }
  }, 50);
}

/* ==================== 先攻列表 ==================== */

function sortInit() {
  // 先攻从高到低，同分保持加入顺序
  state.participants.sort((a, b) => (b.init || 0) - (a.init || 0));
}

function renderInit() {
  const box = $('#init-list');
  box.innerHTML = '';
  const list = state.participants;
  $('#round-tag').textContent = `第 ${state.round} 回合`;
  if (!list.length) {
    box.innerHTML = '<div style="color:var(--muted);padding:20px;text-align:center;">还没有参与者，先添加或从棋子库导入吧。</div>';
    return;
  }
  sortInit();
  if (state.current < 0) state.current = 0;
  if (state.current >= list.length) state.current = 0;
  list.forEach((p, i) => {
    const row = document.createElement('div');
    row.className = 'init-row' + (i === state.current ? ' current' : '') + (p.skip ? ' skipped' : '');
    row.dataset.idx = i;
    row.innerHTML =
      `<span class="mark">${i === state.current ? '▶' : ''}</span>` +
      `<span class="dot" style="background:${p.color || '#6b7482'};"></span>` +
      `<span class="pname"><input class="pname-input" value="${esc(p.name)}" data-f="name"></span>` +
      `<input type="number" value="${p.init || 0}" data-f="init" title="先攻">` +
      `<span class="hp-box">HP <input type="number" value="${p.hp}" data-f="hp">/${p.hpMax}</span>` +
      `<span class="hp-box">AC <input type="number" value="${p.ac}" data-f="ac"></span>` +
      `<label class="skip"><input type="checkbox"${p.skip ? ' checked' : ''} data-f="skip">跳过</label>` +
      `<button class="small danger" data-act="del" title="删除">×</button>`;
    row.addEventListener('click', (e) => {
      if (e.target.closest('input') || e.target.closest('button') || e.target.closest('label')) return;
      state.current = i;
      renderInit();
    });
    box.appendChild(row);
  });
  const cur = list[state.current];
  $('#current-hint').textContent = cur ? `当前：${cur.name}（先攻 ${cur.init}）` : '';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function addParticipant(p) {
  const it = {
    id: 'p' + (uid++),
    name: (p.name || '').trim() || '未命名',
    init: Math.max(0, parseInt(p.init, 10) || 0),
    hp: Math.max(0, parseInt(p.hp, 10) || parseInt(p.hpMax, 10) || 10),
    hpMax: Math.max(1, parseInt(p.hpMax, 10) || 10),
    ac: Math.max(0, parseInt(p.ac, 10) || 10),
    color: p.color || null,
    skip: false,
  };
  state.participants.push(it);
  sortInit();
  if (state.current < 0) state.current = 0;
  renderInit();
  save();
  toast(`已添加「${it.name}」`);
  return it;
}

function nextTurn() {
  const list = state.participants;
  if (!list.length) return;
  const len = list.length;
  let old = state.current < 0 ? len - 1 : state.current;
  let steps = 0;
  let next = (old + 1) % len;
  while (list[next].skip && steps < len) { next = (next + 1) % len; steps++; }
  if (next <= old) {
    state.round++;
    if (state.autoTime) addMinutes(0.1);
  }
  state.current = next;
  renderInit();
  save();
}

function prevTurn() {
  const list = state.participants;
  if (!list.length) return;
  const len = list.length;
  let old = state.current < 0 ? 0 : state.current;
  let steps = 0;
  let prev = (old - 1 + len) % len;
  while (list[prev].skip && steps < len) { prev = (prev - 1 + len) % len; steps++; }
  state.current = prev;
  renderInit();
  save();
}

function applyRowChange(idx, f, value, target) {
  const p = state.participants[idx];
  if (!p) return;
  if (f === 'name') p.name = value.trim() || '未命名';
  else if (f === 'init') p.init = Math.max(0, parseInt(value, 10) || 0);
  else if (f === 'hp') p.hp = Math.max(0, parseInt(value, 10) || 0);
  else if (f === 'ac') p.ac = Math.max(0, parseInt(value, 10) || 0);
  else if (f === 'skip') p.skip = !!target.checked;
  save();
}

/* ==================== 持久化 ==================== */

function save() {
  try { localStorage.setItem(currentStoreKey(), JSON.stringify(state)); }
  catch (e) { toast('⚠ 保存失败：浏览器存储空间不足'); }
}

function load() {
  try {
    const raw = localStorage.getItem(currentStoreKey());
    if (!raw) return;
    const s = JSON.parse(raw);
    state.round = Math.max(1, parseInt(s.round, 10) || 1);
    state.current = typeof s.current === 'number' ? s.current : -1;
    state.autoTime = s.autoTime !== false;
    state.time = s.time && typeof s.time === 'object'
      ? { day: Math.max(1, parseInt(s.time.day, 10) || 1), minutes: Math.max(0, parseFloat(s.time.minutes) || 0) }
      : { day: 1, minutes: 8 * 60 };
    state.participants = Array.isArray(s.participants) ? s.participants.map((p) => ({
      id: p.id || 'p' + (uid++),
      name: p.name || '未命名',
      init: Math.max(0, parseInt(p.init, 10) || 0),
      hp: Math.max(0, parseInt(p.hp, 10) || parseInt(p.hpMax, 10) || 10),
      hpMax: Math.max(1, parseInt(p.hpMax, 10) || 10),
      ac: Math.max(0, parseInt(p.ac, 10) || 10),
      color: p.color || null,
      skip: !!p.skip,
    })) : [];
    state.participants.forEach((p) => { const n = parseInt(String(p.id).replace(/\D/g, ''), 10) || 0; uid = Math.max(uid, n + 1); });
    state.timers = Array.isArray(s.timers) ? s.timers.map((t) => ({
      id: t.id || 'tm' + (uid++),
      name: t.name || '限时',
      color: t.color || TIMER_COLORS[0],
      startMin: Math.max(0, parseFloat(t.startMin) || 0),
      durationMin: Math.max(0.1, parseFloat(t.durationMin) || 0),
    })) : [];
    state.timers.forEach((t) => { const n = parseInt(String(t.id).replace(/\D/g, ''), 10) || 0; uid = Math.max(uid, n + 1); });
    state.weather = s.weather && typeof s.weather === 'object' ? { ...s.weather } : {};
  } catch (e) { /* 损坏则用默认 */ }
}

function exportData() {
  const blob = new Blob([JSON.stringify({ app: 'sangduoer-init-time', version: 1, state }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '先攻计时备份.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出先攻计时数据');
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      const s = d.state || d;
      if (!s || !Array.isArray(s.participants)) throw new Error('bad');
      if (!confirm('用文件内容替换当前先攻和时间数据？')) return;
      state = {
        participants: s.participants,
        timers: s.timers || [],
        weather: s.weather && typeof s.weather === 'object' ? { ...s.weather } : {},
        round: Math.max(1, parseInt(s.round, 10) || 1),
        current: typeof s.current === 'number' ? s.current : -1,
        autoTime: s.autoTime !== false,
        time: s.time && typeof s.time === 'object'
          ? { day: Math.max(1, parseInt(s.time.day, 10) || 1), minutes: Math.max(0, parseFloat(s.time.minutes) || 0) }
          : { day: 1, minutes: 8 * 60 },
      };
      state.participants = state.participants.map((p) => ({
        id: p.id || 'p' + (uid++),
        name: p.name || '未命名',
        init: Math.max(0, parseInt(p.init, 10) || 0),
        hp: Math.max(0, parseInt(p.hp, 10) || parseInt(p.hpMax, 10) || 10),
        hpMax: Math.max(1, parseInt(p.hpMax, 10) || 10),
        ac: Math.max(0, parseInt(p.ac, 10) || 10),
        color: p.color || null,
        skip: !!p.skip,
      }));
      state.timers = state.timers.map((t) => ({
        id: t.id || 'tm' + (uid++),
        name: t.name || '限时',
        color: t.color || TIMER_COLORS[0],
        startMin: Math.max(0, parseFloat(t.startMin) || 0),
        durationMin: Math.max(0.1, parseFloat(t.durationMin) || 0),
      }));
      renderAll();
      save();
      toast('先攻计时数据已导入');
    } catch (e) {
      toast('导入失败：文件格式不正确');
    }
  };
  reader.readAsText(file);
}

function renderAll() {
  $('#auto-time').checked = state.autoTime;
  renderTime();
  renderInit();
}

}

  const t = state.timers.find((x) => x.id === del.dataset.del);
  if (!t) return;
  state.timers = state.timers.filter((x) => x.id !== t.id);
  renderTimers();
  save();
  toast(`已删除「${t.name}」`);
});

$('#links-card h2').addEventListener('click', () => {
  $('#links-card').classList.toggle('collapsed');
});

$('#btn-link-add').addEventListener('click', () => {
  addLink($('#link-name').value, $('#link-url').value);
  $('#link-name').value = '';
  $('#link-url').value = '';
});

$('#links-list').addEventListener('click', (e) => {
  const del = e.target.closest('[data-idx]');
  if (!del) return;
  const i = parseInt(del.dataset.idx, 10);
  if (!userLinks || !userLinks[i]) return;
  if (!confirm(`删除「${userLinks[i].name}」？`)) return;
  userLinks.splice(i, 1);
  saveLinks();
  renderLinks();
});

$('#btn-lib').addEventListener('click', () => {
  $('#lib-search').value = '';
  renderLibPick('');
  $('#lib-modal').hidden = false;
});
$('#btn-lib-close').addEventListener('click', () => { $('#lib-modal').hidden = true; });
$('#lib-modal').addEventListener('click', (e) => { if (e.target === $('#lib-modal')) $('#lib-modal').hidden = true; });
$('#lib-search').addEventListener('input', (e) => renderLibPick(e.target.value));

$('#btn-export').addEventListener('click', exportData);
$('#btn-import').addEventListener('click', () => $('#file-import').click());
$('#file-import').addEventListener('change', (e) => {
  if (e.target.files[0]) importData(e.target.files[0]);
  e.target.value = '';
});
$('#btn-reset').addEventListener('click', () => {
  if (!confirm('清空先攻列表并把时间重置为第 1 年第 1 周第 1 天 08:00？')) return;
  state = { participants: [], timers: [], weather: {}, round: 1, current: -1, autoTime: true, time: { day: 1, minutes: 8 * 60 } };
  renderAll();
  save();
  toast('已重置');
});

bindCampaign();
loadLinks();
renderLinks();
window.addEventListener('focus', () => bindCampaign());
</script>
</body>
</html>
