<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>桑哆尔 · 玩家地图</title>
  <style>
    :root { color-scheme: dark; --bg:#11141c; --panel:#1b202b; --line:#31394a; --text:#edf1f7; --muted:#9aa6ba; --gold:#e0b34c; --good:#4cc38a; --bad:#e74c5e; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; }
    button { border:1px solid var(--line); border-radius:7px; background:#262d3a; color:var(--text); cursor:pointer; padding:6px 9px; }
    button:hover { border-color:#61708c; background:#303a4b; }
    button.primary { background:#376fbe; border-color:#5089d8; }
    input { min-width:0; border:1px solid var(--line); border-radius:6px; background:#10141c; color:var(--text); padding:6px 8px; }
    #topbar { height:52px; display:flex; align-items:center; gap:14px; padding:0 14px; border-bottom:1px solid var(--line); background:#171b25; }
    #brand { color:var(--gold); font-weight:700; white-space:nowrap; }
    #campaign { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); flex:1; }
    #connection { color:var(--muted); white-space:nowrap; font-size:12px; }
    #connection.on { color:var(--good); }
    #player-name { width:130px; }
    #layout { display:grid; grid-template-columns:250px minmax(0,1fr) 270px; height:calc(100vh - 52px); }
    .panel { overflow:auto; background:var(--panel); border-right:1px solid var(--line); padding:10px; }
    #right-panel { border-left:1px solid var(--line); border-right:0; }
    .card { background:#202633; border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
    .card h2 { font-size:14px; margin:0 0 8px; color:#f3f5f8; }
    .hint { color:var(--muted); font-size:12px; margin:6px 0 0; }
    #center { min-width:0; position:relative; }
    #board { position:relative; width:100%; height:100%; overflow:hidden; touch-action:none; background:#0b0d12; }
    #world { position:absolute; transform-origin:0 0; background-color:#ddd6c2; box-shadow:0 0 40px #0008; }
    .map-layer { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
    #doodle-canvas { pointer-events:none; }
    #tokens { position:absolute; inset:0; }
    .token { position:absolute; transform:translate(-50%,-50%); display:grid; place-items:center; cursor:default; }
    .token.mine { cursor:grab; }
    .token.mine .circle { box-shadow:0 0 0 3px #70e5a5, 0 0 18px #44d98caa; }
    .token.dragging { cursor:grabbing; }
    .circle { width:76%; height:76%; border:4px solid var(--ring); border-radius:50%; display:grid; place-items:center; background:#fff; color:#1c2430; font-size:20px; font-weight:700; background-size:cover; background-position:center; background-repeat:no-repeat; }
    .token-name { position:absolute; top:-18px; max-width:130px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; color:white; text-shadow:0 1px 3px #000,1px 0 3px #000,-1px 0 3px #000; font-size:12px; font-weight:700; }
    #empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:16px; }
    #map-controls { position:absolute; right:12px; bottom:12px; display:flex; gap:5px; padding:6px; border:1px solid var(--line); border-radius:9px; background:#171c27dd; }
    .dice-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
    .dice-grid button { padding:6px 3px; }
    .custom-roll,.row { display:flex; gap:6px; margin-top:7px; }
    .custom-roll input,.row input { flex:1; }
    #dice-result { min-height:25px; margin-top:7px; color:var(--gold); font-weight:700; }
    #dice-log { max-height:170px; overflow:auto; margin-top:6px; }
    .roll-line { display:grid; grid-template-columns:48px 50px 1fr 28px; gap:4px; padding:3px 0; border-bottom:1px solid #303747; font-size:12px; }
    .roll-who { color:#8fbaff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .roll-total { color:var(--gold); text-align:right; font-weight:700; }
    #player-links { display:grid; gap:5px; }
    #player-links a { color:#a8c8ff; text-decoration:none; border-bottom:1px solid transparent; }
    #player-links a:hover { border-color:#a8c8ff; }
    #doodle-tools { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
    #doodle-tools button.active { background:#376fbe; border-color:#6fa4ed; }
    #doodle-colors { display:flex; gap:6px; margin-top:8px; }
    #doodle-colors button { width:22px; height:22px; padding:0; border-radius:50%; border:2px solid transparent; }
    #doodle-colors button.active { border-color:white; }
    #detail[hidden] { display:none; }
    .token-head { display:flex; align-items:center; gap:9px; margin-bottom:10px; }
    #detail-icon { width:42px; height:42px; border:3px solid #5b8cff; border-radius:50%; display:grid; place-items:center; background:#fff; color:#19222f; background-size:cover; background-position:center; font-size:20px; }
    #detail-name { font-weight:700; flex:1; }
    #detail-type { color:var(--muted); font-size:12px; }
    .field { margin-top:10px; }
    .field label { display:block; color:var(--muted); font-size:12px; margin-bottom:4px; }
    .three { display:grid; grid-template-columns:1fr auto 1fr; gap:5px; align-items:center; }
    .ac-row { display:flex; align-items:center; gap:8px; }
    .ac-row input { width:90px; }
    .hp-bar { height:8px; border-radius:5px; background:#10141c; overflow:hidden; margin-top:7px; }
    .hp-bar i { display:block; height:100%; background:var(--good); }
    .quick { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-top:7px; }
    .quick button { padding:5px 2px; font-size:12px; }
    #toast { position:fixed; z-index:20; left:50%; bottom:18px; transform:translateX(-50%); padding:8px 12px; border-radius:8px; background:#10141de8; border:1px solid #4c5870; opacity:0; pointer-events:none; transition:opacity .18s; }
    #toast.show { opacity:1; }
    @media (max-width:900px) { #layout { grid-template-columns:1fr; } .panel { display:none; } #right-panel { display:block; position:absolute; z-index:4; right:0; top:0; width:min(290px,86vw); height:100%; background:#1b202bf2; } #right-panel:has(#detail[hidden]) { display:none; } }
  </style>
</head>
<body>
  <header id="topbar">
    <div id="brand">🐉 桑哆尔 · 玩家地图</div>
    <div id="campaign"></div>
    <input id="player-name" maxlength="24" placeholder="你的名字">
    <span id="connection">连接中…</span>
  </header>
  <main id="layout">
    <aside class="panel">
      <section class="card">
        <h2>🎲 掷骰</h2>
        <div class="dice-grid">
          <button data-die="d4">d4</button><button data-die="d6">d6</button><button data-die="d8">d8</button><button data-die="d10">d10</button>
          <button data-die="d12">d12</button><button data-die="d20">d20</button><button data-die="d100">d100</button>
        </div>
        <div class="custom-roll"><input id="dice-expr" placeholder="如 2d6+3"><button id="dice-roll">掷</button></div>
        <div id="dice-result"></div><div id="dice-log"></div>
      </section>
      <section class="card"><h2>📚 常用网站</h2><div id="player-links"></div></section>
      <section class="card">
        <h2>🖍️ 协作涂鸦</h2>
        <div id="doodle-tools"><button data-tool="pen">画笔</button><button data-tool="line">直线</button><button data-tool="arrow">箭头</button><button data-tool="circle">圆圈</button></div>
        <div id="doodle-colors"><button class="active" data-color="#ff4d4f" style="background:#ff4d4f"></button><button data-color="#ffd23f" style="background:#ffd23f"></button><button data-color="#4f7cff" style="background:#4f7cff"></button><button data-color="#4cc38a" style="background:#4cc38a"></button><button data-color="#ffffff" style="background:#fff"></button></div>
        <p class="hint">选择工具后在地图拖动；涂鸦会同步给所有人。</p>
      </section>
    </aside>
    <section id="center"><div id="board"><div id="world"><canvas id="fog-canvas" class="map-layer"></canvas><canvas id="doodle-canvas" class="map-layer"></canvas><div id="tokens"></div></div><div id="empty">⏳ 等待主机开团…</div><div id="map-controls"><button id="zoom-out">−</button><button id="zoom-in">＋</button><button id="fit">⛶</button></div></div></section>
    <aside class="panel" id="right-panel">
      <section class="card"><h2>🧙 我的棋子</h2>
        <div id="detail" hidden>
          <div class="token-head"><div id="detail-icon">🧙</div><div><div id="detail-name"></div><div id="detail-type"></div></div><button id="detail-close">✕</button></div>
          <div class="field"><label>生命值</label><div class="three"><input id="hp" type="number" min="0"><span>/</span><input id="hp-max" type="number" min="1"></div><div class="hp-bar"><i id="hp-bar"></i></div><div class="quick"><button data-hp="-5">−5</button><button data-hp="-1">−1</button><button data-hp="1">＋1</button><button data-hp="5">＋5</button><button data-hp="full">回满</button></div></div>
          <div class="field"><label>AC</label><div class="ac-row"><input id="ac" type="number" min="0" max="99"><span class="hint">由你自己维护</span></div></div>
        </div>
        <p id="detail-empty" class="hint">点击属于你的绿色棋子，即可调整 HP 和 AC。</p>
      </section>
    </aside>
  </main>
  <div id="toast"></div>
  <script src="../three.min.js"></script>
  <script src="../骰子动画.js?v=26"></script>
  <script>
  'use strict';
  const $ = (s) => document.querySelector(s);
  const TYPE = { pc:{label:'玩家角色',ring:'#5b8cff'}, enemy:{label:'敌人',ring:'#ef476f'}, npc:{label:'中立NPC',ring:'#f4a261'}, ally:{label:'友好NPC',ring:'#2ecc71'} };
  const clamp = (n,a,b) => Math.min(b,Math.max(a,n));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const world = $('#world'), board = $('#board'), fog = $('#fog-canvas'), fogCtx = fog.getContext('2d'), doodle = $('#doodle-canvas'), doodleCtx = doodle.getContext('2d');
  let state = null, currentMap = null, view = {scale:1,ox:0,oy:0}, myName = '', selectedId = null, drag = null, doodleTool = null, doodleColor = '#ff4d4f', doodleDraft = null, doodleId = 1, toastTimer = null, localRolls = new Set(), lastMapViewKey = '';
  try { myName = localStorage.getItem('sangduoer-watch-name') || ''; } catch (e) {}
  $('#player-name').value = myName;

  function toast(msg) { const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2400); }
  function mine(t) { return !!myName && (t.owner || '') === myName; }
  function assetUrl(t) { const src=t.iconImgPath || t.iconImgHd || t.iconImg || ''; return src && !/^(?:data:|https?:|\/)/.test(src) ? '../棋子库/' + src.replace(/^棋子库\//,'') : src; }
  function applyView() { world.style.transform = 'translate(' + view.ox + 'px,' + view.oy + 'px) scale(' + view.scale + ')'; }
  function fit() { if (!currentMap) return; const r=board.getBoundingClientRect(), m=currentMap; view.scale=Math.min(r.width/m.mapW,r.height/m.mapH,2); view.ox=(r.width-m.mapW*view.scale)/2; view.oy=(r.height-m.mapH*view.scale)/2; applyView(); }
  function point(e) { const r=world.getBoundingClientRect(); return {x:(e.clientX-r.left)/view.scale,y:(e.clientY-r.top)/view.scale}; }
  function snap(x,y,t) { const g=currentMap.gridSize||50, size=t.size||1; const sx=size>=2?Math.round(x/g)*g:Math.round(x/g-.5)*g+g/2; const sy=size>=2?Math.round(y/g)*g:Math.round(y/g-.5)*g+g/2; const margin=size>=2?g:g/2; return {x:clamp(sx,margin,currentMap.mapW-margin),y:clamp(sy,margin,currentMap.mapH-margin)}; }

  function renderMap(m) {
    const g=m.gridSize||50;
    const grid='repeating-linear-gradient(to right,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 1px,transparent 1px,transparent '+g+'px),repeating-linear-gradient(to bottom,rgba(255,255,255,.7) 0,rgba(255,255,255,.7) 1px,transparent 1px,transparent '+g+'px)';
    world.style.width=m.mapW+'px'; world.style.height=m.mapH+'px';
    world.style.backgroundImage=m.mapData ? ((state.showGrid===false?'':' '+grid+',')+'url("'+m.mapData+'")') : (state.showGrid===false?'none':grid);
    world.style.backgroundSize=m.mapData && state.showGrid!==false ? g+'px '+g+'px,'+'100% 100%' : '100% 100%';
  }
  function renderFog(m) {
    fog.width=m.mapW; fog.height=m.mapH; fogCtx.clearRect(0,0,m.mapW,m.mapH);
    if (!state.fogOn || !m.fog) return;
    fogCtx.fillStyle='rgba(8,10,16,.94)';
    Object.keys(m.fog).forEach(k=>{ const p=k.split(',').map(Number); fogCtx.fillRect(p[0]*m.gridSize,p[1]*m.gridSize,m.gridSize,m.gridSize); });
  }
  function drawStroke(g,s) {
    g.strokeStyle=s.color; g.fillStyle=s.color; g.lineWidth=s.width||5; g.lineCap='round'; g.lineJoin='round';
    if (s.tool==='pen') { if (!s.points || s.points.length<2) return; g.beginPath(); g.moveTo(s.points[0].x,s.points[0].y); s.points.slice(1).forEach(p=>g.lineTo(p.x,p.y)); g.stroke(); return; }
    g.beginPath(); g.moveTo(s.x0,s.y0); g.lineTo(s.x1,s.y1); g.stroke();
    if (s.tool==='arrow') { const a=Math.atan2(s.y1-s.y0,s.x1-s.x0),h=Math.max(10,(s.width||5)*2); g.beginPath(); g.moveTo(s.x1,s.y1); g.lineTo(s.x1-h*Math.cos(a-Math.PI/6),s.y1-h*Math.sin(a-Math.PI/6)); g.lineTo(s.x1-h*Math.cos(a+Math.PI/6),s.y1-h*Math.sin(a+Math.PI/6)); g.closePath(); g.fill(); }
    if (s.tool==='circle') { const r=Math.hypot(s.x1-s.x0,s.y1-s.y0); g.beginPath(); g.arc(s.x0,s.y0,r,0,Math.PI*2); g.stroke(); }
  }
  function renderDoodles() { if (!currentMap) return; doodle.width=currentMap.mapW; doodle.height=currentMap.mapH; doodleCtx.clearRect(0,0,doodle.width,doodle.height); (currentMap.doodles||[]).forEach(s=>drawStroke(doodleCtx,s)); if (doodleDraft) drawStroke(doodleCtx,doodleDraft); }
  function renderTokens(m) {
    const box=$('#tokens'); box.innerHTML='';
    const mountIds=new Set((m.tokens||[]).filter(t=>(t.size||1)>=2).map(t=>t.id));
    (m.tokens||[]).forEach(t=>{
      if (t.mountId && mountIds.has(t.mountId)) return;
      const size=(m.gridSize||50)*(t.size||1), meta=TYPE[t.type]||TYPE.npc, el=document.createElement('div');
      el.className='token'+(mine(t)?' mine':''); el.dataset.id=t.id; el.style.left=t.x+'px'; el.style.top=t.y+'px'; el.style.width=size+'px'; el.style.height=size+'px';
      const circle=document.createElement('div'); circle.className='circle'; circle.style.setProperty('--ring',meta.ring);
      const url=assetUrl(t); if (url) circle.style.backgroundImage='url("'+url+'")'; else circle.textContent=t.icon||'?';
      const name=document.createElement('div'); name.className='token-name'; name.textContent=t.name;
      el.append(circle,name); box.appendChild(el);
    });
  }
  function renderLinks(list) { const box=$('#player-links'); box.innerHTML=''; (list||[]).forEach(l=>{ if (!l || !l.name || !l.url) return; const a=document.createElement('a'); a.href=l.url; a.target='_blank'; a.rel='noopener'; a.textContent=l.name; box.appendChild(a); }); }
  function render(next) {
    state=next; currentMap=(next.maps||[]).find(m=>m.id===next.activeMapId)||(next.maps||[])[0]||null;
    $('#connection').textContent='已连接'; $('#connection').classList.add('on'); $('#campaign').textContent=next.campaignName?'📂 '+next.campaignName:'';
    renderLinks(next._links);
    if (!currentMap) { $('#empty').style.display='grid'; return; }
    $('#empty').style.display='none'; renderMap(currentMap); renderFog(currentMap); renderDoodles(); renderTokens(currentMap);
    const mapViewKey=currentMap.id+'|'+currentMap.mapW+'|'+currentMap.mapH;
    if(mapViewKey!==lastMapViewKey){lastMapViewKey=mapViewKey;fit();}
    if(next._bgm) applyBgm(next._bgm);
    if (selectedId) openDetail(selectedId);
  }

  let patchTimer=null, pendingPatch={};
  function sendPatch(id, patch) {
    if (!myName || !id) return;
    pendingPatch=Object.assign(pendingPatch,patch);
    clearTimeout(patchTimer);
    patchTimer=setTimeout(()=>{ const p=pendingPatch; pendingPatch={}; fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:myName,action:{op:'patchToken',tokenId:id,patch:p}})}).then(r=>r.json()).then(d=>{if(d && d.ok===false) toast('⚠ '+(d.error||'同步失败'));}).catch(()=>toast('⚠ 修改未送达')); },180);
  }
  function openDetail(id) {
    const t=currentMap && currentMap.tokens.find(x=>x.id===id);
    if (!t || !mine(t)) { selectedId=null; $('#detail').hidden=true; $('#detail-empty').hidden=false; return; }
    selectedId=id; $('#detail').hidden=false; $('#detail-empty').hidden=true;
    $('#detail-name').textContent=t.name; $('#detail-type').textContent=(TYPE[t.type]||TYPE.npc).label;
    const icon=$('#detail-icon'), url=assetUrl(t); icon.textContent=url?'':(t.icon||'?'); icon.style.backgroundImage=url?'url("'+url+'")':'none';
    $('#hp').value=t.hp; $('#hp-max').value=t.hpMax; $('#ac').value=t.ac;
    const pct=clamp((t.hp/Math.max(1,t.hpMax))*100,0,100); $('#hp-bar').style.width=pct+'%'; $('#hp-bar').style.background=pct>50?'#4cc38a':pct>25?'#f4a261':'#e74c5e';
  }
  function updateOwned(field,value) { const t=currentMap && currentMap.tokens.find(x=>x.id===selectedId); if (!t) return; t[field]=value; sendPatch(t.id,{[field]:value}); openDetail(t.id); }
  function sendMove(t) { if (!myName) return; fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:myName,action:{op:'moveToken',mapId:currentMap.id,tokenId:t.id,x:t.x,y:t.y}})}).then(r=>r.json()).then(d=>{if(d && d.ok===false) toast('⚠ '+(d.error||'移动失败'));}).catch(()=>toast('⚠ 移动未送达')); }
  function sendDoodles() { if (!myName || !currentMap) return; fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:myName,action:{op:'doodle',mapId:currentMap.id,doodles:currentMap.doodles||[]}})}).catch(()=>toast('⚠ 涂鸦未送达')); }

  function parseDice(expr) { const m=String(expr||'').trim().toLowerCase().match(/^(\d*)d(\d+)([+-]\d+)?$/); if (!m) return null; const n=+(m[1]||1), sides=+m[2], mod=+(m[3]||0); return n>0&&n<=100&&sides>=2&&sides<=1000?{n,sides,mod,label:m[0]}:null; }
  function roll(expr) { const d=parseDice(expr); if(!d){toast('骰子格式如 2d6+3');return;} const dice=Array.from({length:d.n},()=>1+Math.floor(Math.random()*d.sides)), total=dice.reduce((a,b)=>a+b,0)+d.mod, detail=dice.join(' + ')+(d.mod?(d.mod>0?' + ':' ')+d.mod:''); const rid='r'+Date.now()+Math.random(); localRolls.add(rid); addRoll(myName||'我',d.label,detail,total); if(window.playDieAnimation) window.playDieAnimation(d.sides,d.label,total,{dice}); fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:myName||'玩家',action:{op:'roll',rid,name:myName||'玩家',expr:d.label,detail,total,sides:d.sides,dice}})}).catch(()=>toast('⚠ 掷骰未送达')); }
  function addRoll(who,expr,detail,total) { const row=document.createElement('div'); row.className='roll-line'; row.innerHTML='<span class="roll-who">'+esc(who)+'</span><span>'+esc(expr)+'</span><span>'+esc(detail)+'</span><span class="roll-total">'+total+'</span>'; $('#dice-log').prepend(row); while($('#dice-log').children.length>30) $('#dice-log').lastChild.remove(); $('#dice-result').textContent=expr+' → '+total; }
  function applyAction(a) {
    if (!a) return;
    if (a.op==='roll') { if(a.rid && localRolls.has(a.rid)){localRolls.delete(a.rid);return;} addRoll(a.name||'玩家',a.expr||'',a.detail||'',a.total); if(window.playDieAnimation) window.playDieAnimation(a.sides||20,a.expr||'',a.total,{dice:a.dice}); return; }
    if (a.op==='doodle') { if(currentMap && a.mapId===currentMap.id && Array.isArray(a.doodles)){currentMap.doodles=a.doodles;renderDoodles();} return; }
    const m=state && (state.maps||[]).find(x=>x.id===(a.mapId||currentMap&&currentMap.id)); const t=m && (m.tokens||[]).find(x=>x.id===a.tokenId); if(!t) return;
    if (a.op==='moveToken') { t.x=a.x;t.y=a.y; const el=document.querySelector('.token[data-id="'+t.id+'"]'); if(el){el.style.left=t.x+'px';el.style.top=t.y+'px';} }
    if (a.op==='patchToken') { ['hp','hpMax','ac'].forEach(k=>{if(a.patch && k in a.patch)t[k]=a.patch[k];}); if(selectedId===t.id) openDetail(t.id); }
  }

  board.addEventListener('pointerdown',e=>{
    if(e.target.closest('button')) return;
    const token=e.target.closest('.token');
    if(token){ const t=currentMap && currentMap.tokens.find(x=>x.id===token.dataset.id); if(t && mine(t)){selectedId=t.id; openDetail(t.id); drag={kind:'token',id:t.id}; board.setPointerCapture(e.pointerId); token.classList.add('dragging');} return; }
    if(doodleTool && currentMap){ const p=point(e); doodleDraft=doodleTool==='pen'?{tool:'pen',color:doodleColor,width:5,points:[p]}:{tool:doodleTool,color:doodleColor,width:5,x0:p.x,y0:p.y,x1:p.x,y1:p.y}; drag={kind:'doodle'}; board.setPointerCapture(e.pointerId); renderDoodles(); return; }
    drag={kind:'pan',x:e.clientX,y:e.clientY,ox:view.ox,oy:view.oy}; board.setPointerCapture(e.pointerId);
  });
  board.addEventListener('pointermove',e=>{
    if(!drag || !currentMap) return;
    if(drag.kind==='pan'){view.ox=drag.ox+e.clientX-drag.x;view.oy=drag.oy+e.clientY-drag.y;applyView();return;}
    if(drag.kind==='token'){const t=currentMap.tokens.find(x=>x.id===drag.id);if(!t)return; const p=point(e), q=state.snap===false?p:snap(p.x,p.y,t);t.x=q.x;t.y=q.y;const el=document.querySelector('.token[data-id="'+t.id+'"]');if(el){el.style.left=t.x+'px';el.style.top=t.y+'px';}return;}
    if(drag.kind==='doodle'){const p=point(e);if(doodleDraft.tool==='pen')doodleDraft.points.push(p);else{doodleDraft.x1=p.x;doodleDraft.y1=p.y;}renderDoodles();}
  });
  function finish(e){ if(!drag)return; if(drag.kind==='token'){const t=currentMap&&currentMap.tokens.find(x=>x.id===drag.id);if(t)sendMove(t);const el=document.querySelector('.token[data-id="'+drag.id+'"]');if(el)el.classList.remove('dragging');} if(drag.kind==='doodle'&&doodleDraft){const d=doodleDraft;const valid=d.tool==='pen'?d.points.length>1:Math.hypot(d.x1-d.x0,d.y1-d.y0)>4;if(valid){d.id='pd'+(doodleId++);currentMap.doodles=currentMap.doodles||[];currentMap.doodles.push(d);sendDoodles();}doodleDraft=null;renderDoodles();}drag=null; }
  board.addEventListener('pointerup',finish); board.addEventListener('pointercancel',finish);
  board.addEventListener('wheel',e=>{e.preventDefault();if(!currentMap)return;const r=world.getBoundingClientRect(),wx=(e.clientX-r.left)/view.scale,wy=(e.clientY-r.top)/view.scale,ns=clamp(view.scale*Math.exp(-e.deltaY*.0012),.2,4);view.ox+=e.clientX-r.left-wx*ns;view.oy+=e.clientY-r.top-wy*ns;view.scale=ns;applyView();},{passive:false});
  $('#zoom-in').onclick=()=>{view.scale=clamp(view.scale*1.25,.2,4);applyView();}; $('#zoom-out').onclick=()=>{view.scale=clamp(view.scale/1.25,.2,4);applyView();}; $('#fit').onclick=fit;
  $('#player-name').addEventListener('input',()=>{myName=$('#player-name').value.trim();try{localStorage.setItem('sangduoer-watch-name',myName);}catch(e){}if(currentMap)renderTokens(currentMap);if(selectedId)openDetail(selectedId);});
  $('#detail-close').onclick=()=>{selectedId=null;$('#detail').hidden=true;$('#detail-empty').hidden=false;};
  $('#hp').addEventListener('input',()=>updateOwned('hp',clamp(parseInt($('#hp').value,10)||0,0,99999)));
  $('#hp-max').addEventListener('input',()=>updateOwned('hpMax',clamp(parseInt($('#hp-max').value,10)||1,1,99999)));
  $('#ac').addEventListener('input',()=>updateOwned('ac',clamp(parseInt($('#ac').value,10)||0,0,99)));
  document.querySelectorAll('[data-hp]').forEach(b=>b.onclick=()=>{const t=currentMap&&currentMap.tokens.find(x=>x.id===selectedId);if(!t)return;const v=b.dataset.hp;t.hp=v==='full'?t.hpMax:clamp(t.hp+parseInt(v,10),0,t.hpMax);updateOwned('hp',t.hp);});
  document.querySelectorAll('[data-die]').forEach(b=>b.onclick=()=>roll(b.dataset.die)); $('#dice-roll').onclick=()=>roll($('#dice-expr').value); $('#dice-expr').addEventListener('keydown',e=>{if(e.key==='Enter')roll($('#dice-expr').value);});
  document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{doodleTool=doodleTool===b.dataset.tool?null:b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b&&!!doodleTool));});
  document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{doodleColor=b.dataset.color;document.querySelectorAll('[data-color]').forEach(x=>x.classList.toggle('active',x===b));});
  window.addEventListener('resize',fit);

  const playerAudio=new Audio(); let bgmUrl='';
  function applyBgm(a){if(!a)return;if(a.action==='play'){if(a.url&&a.url!==bgmUrl){bgmUrl=a.url;playerAudio.src=a.url;playerAudio.currentTime=a.time||0;}playerAudio.play().catch(()=>toast('🔇 点击页面后可播放 BGM'));}else playerAudio.pause();}
  const es=new EventSource('/api/events');
  es.onopen=()=>{$('#connection').textContent='已连接';$('#connection').classList.add('on');};
  es.onerror=()=>{$('#connection').textContent='重连中…';$('#connection').classList.remove('on');};
  es.onmessage=e=>{try{const ev=JSON.parse(e.data);if(ev.type==='state')render(ev.state);else if(ev.type==='action'){if(ev.action&&ev.action.op==='bgm')applyBgm(ev.action);else applyAction(ev.action);}}catch(err){}};
  </script>
</body>
</html>
