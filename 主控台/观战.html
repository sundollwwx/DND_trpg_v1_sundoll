<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>玩家模式 · 桑哆尔</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
:root {
  --bg:#101218; --panel:#191c25; --panel2:#212531; --panel3:#2a3140;
  --border:#2b303d; --text:#e8eaf0; --muted:#9aa3b2; --accent:#e0b34c;
}
html, body { height: 100%; }
body { display:flex; flex-direction:column; background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif; overflow:hidden; }
header {
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:8px 14px;
  background:var(--panel); border-bottom:1px solid var(--border); font-size:13px;
}
.brand { font-size:16px; font-weight:700; }
.brand em { color:var(--accent); font-style:normal; }
.conn { color:var(--muted); }
.conn.on { color:#2ecc71; }
.campaign { color:var(--accent); }
#player-box { display:flex; align-items:center; gap:6px; margin-left:auto; }
#player-name {
  width:130px; padding:4px 8px; border-radius:8px; border:1px solid var(--border);
  background:var(--panel2); color:var(--text); font-size:13px; outline:none;
}
#player-name:focus { border-color:var(--accent); }
#player-hint { color:var(--muted); font-size:12px; }

#layout { flex:1; display:flex; min-height:0; }
.panel { width:250px; min-width:210px; background:var(--panel); border-right:1px solid var(--border); overflow-y:auto; padding:8px; display:flex; flex-direction:column; gap:8px; }
#right-panel { border-right:none; border-left:1px solid var(--border); width:310px; min-width:270px; }
.card { position:relative; background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px; }
.card h2 { font-size:14px; color:var(--accent); margin-bottom:8px; cursor:pointer; user-select:none; }
.card h2::after { content:' ▾'; font-size:11px; color:var(--muted); }
.card.collapsed h2::after { content:' ▸'; }
.card.collapsed > *:not(h2) { display:none; }

/* 骰子 */
.dice-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.die-btn { border:1px solid var(--border); background:var(--panel3); color:var(--text); border-radius:8px; padding:7px 0; cursor:pointer; font-size:12px; }
.die-btn:hover { border-color:var(--accent); }
.dice-advrow { display:flex; gap:5px; margin-top:5px; }
.dice-advrow .die-btn { flex:1; }
.custom-roll { display:flex; gap:5px; margin-top:5px; }
#dice-expr { flex:1; min-width:0; padding:6px 8px; border-radius:8px; border:1px solid var(--border); background:var(--panel3); color:var(--text); font-size:12px; }
#dice-expr:focus { outline:none; border-color:var(--accent); }
#dice-roll { border:none; background:var(--accent); color:#111; border-radius:8px; padding:0 14px; cursor:pointer; font-weight:700; }
#dice-result { min-height:24px; font-size:15px; font-weight:700; text-align:center; color:var(--accent); display:flex; align-items:center; justify-content:center; margin-top:6px; }
#dice-result.rolling { animation:diceSpin .55s ease-in-out; }
@keyframes diceSpin { 0%{transform:rotate(0) scale(1);} 40%{transform:rotate(180deg) scale(1.4);} 70%{transform:rotate(300deg) scale(.9);} 100%{transform:rotate(360deg) scale(1);} }
#dice-log { max-height:170px; overflow-y:auto; display:flex; flex-direction:column; gap:4px; margin-top:6px; }
.roll-line { display:flex; gap:6px; align-items:baseline; background:var(--panel3); border-radius:8px; padding:4px 8px; font-size:12px; }
.roll-who { color:var(--accent); white-space:nowrap; }
.roll-expr { color:var(--muted); white-space:nowrap; }
.roll-detail { flex:1; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.roll-total { font-weight:700; color:#2ecc71; }

/* 涂鸦 */
.tool-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:5px; }
.board-tool { border:1px solid var(--border); background:var(--panel3); color:var(--text); border-radius:8px; padding:7px 0; cursor:pointer; font-size:12px; }
.board-tool.active { border-color:var(--accent); color:var(--accent); background:rgba(224,179,76,.12); }
.doodle-colors { display:flex; gap:5px; margin-top:7px; }
.doodle-color { width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
.doodle-color.active { border-color:#fff; }
.doodle-widths { display:flex; gap:5px; margin-top:6px; }
.doodle-widths button { flex:1; border:1px solid var(--border); background:var(--panel3); color:var(--text); border-radius:8px; padding:5px 0; cursor:pointer; font-size:12px; }
.doodle-widths button.active { border-color:var(--accent); color:var(--accent); }
.doodle-actions { display:flex; gap:5px; margin-top:7px; }
.doodle-actions button { flex:1; border:1px solid var(--border); background:var(--panel3); color:var(--text); border-radius:8px; padding:6px 0; cursor:pointer; font-size:12px; }
.hint { font-size:11px; color:var(--muted); line-height:1.5; margin-top:7px; }
.player-links { display:flex; flex-direction:column; gap:4px; }
.player-links a { display:block; background:var(--panel3); border:1px solid var(--border); color:var(--text); text-decoration:none; border-radius:8px; padding:6px 8px; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.player-links a:hover { border-color:var(--accent); color:var(--accent); }

#center { flex:1; display:flex; flex-direction:column; min-width:0; }
#board-wrap { flex:1; min-height:0; position:relative; }
#board { position:absolute; inset:0; overflow:hidden; background:#0b0d12; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
.map-layer { position:absolute; left:0; top:0; pointer-events:none; }
#tokens { position:absolute; left:0; top:0; }
.token { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.circle {
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  border:2px solid var(--ring,#5b8cff); background:#fff; background-size:cover; background-position:center;
  font-size:16px; line-height:1; box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 2px 7px rgba(0,0,0,.5);
}
.name {
  position:absolute; transform:translate(-50%,-100%); top:-4px; white-space:nowrap;
  color:#fff; background:rgba(10,12,18,.62); padding:1px 6px; border-radius:8px;
  font-size:10px; text-shadow:0 1px 2px rgba(0,0,0,.8); pointer-events:none;
}
.name.below { transform:translate(-50%,0); top:auto; bottom:-16px; }
.rider { position:absolute; border-radius:50%; border:1.5px solid var(--ring,#5b8cff); background:#fff; background-size:cover; background-position:center; box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 2px 5px rgba(0,0,0,.5); }
.badges { position:absolute; top:-8px; right:-2px; display:flex; gap:2px; pointer-events:none; }
.badge { width:15px; height:15px; font-size:9px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:1px solid rgba(255,255,255,.6); }
.empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; line-height:2; }
.token.mine { cursor:grab; touch-action:none; }
.token.mine.dragging { cursor:grabbing; }
.token.mine .circle { box-shadow:0 0 0 3px rgba(46,204,113,.9), 0 0 0 1px rgba(0,0,0,.4), 0 2px 7px rgba(0,0,0,.5); }
.rider.mine { outline:2px solid rgba(46,204,113,.9); outline-offset:1px; cursor:grab; touch-action:none; }

#map-controls { position:absolute; top:10px; right:10px; z-index:30; display:flex; gap:6px; }
#map-controls button { width:34px; height:34px; border-radius:9px; font-size:16px; border:1px solid var(--border); background:rgba(25,28,37,.9); color:var(--text); cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.35); }
#map-controls button:hover { border-color:var(--accent); color:var(--accent); }

/* 底部先攻条 */
#init-bar { height:52px; min-height:52px; display:flex; align-items:center; gap:12px; padding:0 12px; background:var(--panel); border-top:1px solid var(--border); }
.init-left { display:flex; align-items:center; gap:10px; white-space:nowrap; }
.init-title { font-weight:700; color:var(--accent); }
#round { color:var(--muted); font-size:13px; }
#init-list { display:flex; gap:5px; overflow-x:auto; flex:1; padding:4px 0; }
.init-chip { padding:5px 12px; border-radius:10px; background:var(--panel2); border:1px solid var(--border); font-size:12px; white-space:nowrap; display:flex; gap:8px; align-items:center; }
.init-chip.current { border-color:var(--accent); color:var(--accent); background:rgba(224,179,76,.12); }
.init-chip .init-dot { width:8px; height:8px; border-radius:50%; }
.init-chip .init-val { font-weight:700; }

/* 右侧棋子属性 */
#detail { display:flex; flex-direction:column; gap:8px; }
.detail-head { display:flex; align-items:center; gap:10px; }
.detail-icon { width:46px; height:46px; min-width:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--panel3); border:2px solid var(--border); background-size:cover; background-position:center; font-size:20px; }
.detail-title { flex:1; min-width:0; }
.detail-title b { display:block; font-size:15px; }
.detail-sub { font-size:12px; color:var(--muted); line-height:1.5; overflow-wrap:anywhere; }
.menu-close { border:none; background:var(--panel3); color:var(--muted); width:24px; height:24px; border-radius:50%; cursor:pointer; }
.hp-bar { height:8px; border-radius:5px; background:var(--panel3); overflow:hidden; }
.hp-bar i { display:block; height:100%; border-radius:5px; background:#4cc38a; transition:width .3s; }
.sec { border-top:1px solid var(--border); padding-top:8px; }
.sec h5 { font-size:11px; color:var(--accent); margin-bottom:6px; }
.menu-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.menu-stat { background:var(--panel3); border:1px solid var(--border); border-radius:8px; padding:4px 6px; font-size:11px; text-align:center; }
.menu-stat b { display:block; font-size:13px; }
.menu-stat input { width:100%; text-align:center; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:2px 0; font-size:13px; margin-top:2px; }
.menu-stat input:focus { outline:none; border-color:var(--accent); }
.menu-stat.save-trained { border-color:#4cc38a; color:#4cc38a; }
.skill-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }
.skill-btn { display:flex; justify-content:space-between; align-items:center; gap:4px; background:var(--panel3); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:5px 6px; font-size:11px; }
.skill-btn b { font-size:12px; }
.skill-btn.prof { border-color:#4cc38a; color:#4cc38a; }
.skill-btn.expert { border-color:#e0b34c; color:#e0b34c; background:rgba(224,179,76,.1); }
.menu-spells { display:flex; flex-wrap:wrap; gap:5px; }
.spell-chip { background:var(--panel3); border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:12px; }
.menu-eq { display:flex; flex-direction:column; gap:4px; }
.eq-item { background:var(--panel3); border:1px solid var(--border); border-radius:8px; padding:4px 8px; font-size:12px; }
.eq-item b { color:var(--text); }
.eq-item span { color:var(--muted); }
.hp-edit { display:flex; align-items:center; gap:5px; font-size:13px; margin-bottom:4px; }
.hp-edit input { width:56px; padding:3px 5px; border-radius:7px; border:1px solid var(--border); background:var(--panel3); color:var(--text); font-size:13px; text-align:center; }
.hp-edit input:focus { outline:none; border-color:var(--accent); }
.hp-edit .slash { color:var(--muted); }
.hp-edit #detail-ac { margin-left:auto; color:var(--accent); font-weight:700; font-size:12px; }
.hitdice-box { display:flex; align-items:center; gap:6px; margin-top:6px; padding:5px 7px; background:var(--panel3); border:1px solid var(--border); border-radius:8px; flex-wrap:wrap; }
.hitdice-box .hd-label { font-size:11px; color:var(--muted); white-space:nowrap; }
.hitdice-box .slot-cells { flex:0 0 auto; }
.hitdice-box .hd-roll, .hitdice-box .hd-full { white-space:nowrap; border:1px solid var(--border); background:var(--panel2); color:var(--text); border-radius:7px; padding:4px 8px; font-size:11px; cursor:pointer; }
.hitdice-box .hd-roll:hover, .hitdice-box .hd-full:hover { border-color:var(--accent); color:var(--accent); }
.menu-base { display:flex; flex-direction:column; gap:5px; }
.base-row { display:flex; align-items:center; gap:6px; background:var(--panel3); border:1px solid var(--border); border-radius:8px; padding:3px 8px; font-size:12px; }
.base-row span { width:64px; color:var(--muted); }
.base-row input { flex:1; min-width:0; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:3px 6px; font-size:12px; }
.base-row input:focus { outline:none; border-color:var(--accent); }
.eq-add-row { display:flex; gap:5px; margin-bottom:6px; }
.eq-add-row select { flex:1; min-width:0; background:var(--panel3); border:1px solid var(--border); color:var(--text); border-radius:7px; padding:5px 6px; font-size:12px; }
.eq-add-row button { border:none; background:var(--accent); color:#111; border-radius:7px; padding:0 12px; font-weight:700; cursor:pointer; }
.eq-row { display:grid; grid-template-columns:1fr 56px 58px 60px 22px; gap:4px; align-items:center; background:var(--panel3); border:1px solid var(--border); border-radius:8px; padding:3px 5px; }
.eq-row input, .eq-row select { width:100%; min-width:0; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:3px 4px; font-size:11px; }
.eq-row input:focus, .eq-row select:focus { outline:none; border-color:var(--accent); }
.eq-row .eq-del { border:none; background:none; color:#e74c5e; cursor:pointer; font-size:14px; }
.menu-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; }
.status-cat { grid-column:1/-1; font-size:11px; color:var(--accent); margin:7px 0 2px; }
.menu-btn { border:1px solid var(--border); background:var(--panel3); color:var(--text); border-radius:8px; padding:6px 2px; font-size:11px; cursor:pointer; line-height:1.25; }
.menu-btn:hover { border-color:var(--accent); }
.menu-btn.on { background:rgba(46,204,113,.22); border-color:#2ecc71; color:#2ecc71; }

/* 法术环位：蓝色小方格（玩家只读） */
.spell-slots-ui { display:flex; flex-direction:column; gap:8px; }
.spell-sec { background:var(--panel3); border:1px solid var(--border); border-radius:8px; padding:6px; }
.spell-sec-head { font-size:12px; color:var(--accent); font-weight:700; margin-bottom:5px; }
.slot-row { display:flex; align-items:center; gap:6px; padding:3px 0; }
.slot-lv { width:46px; font-size:11px; color:var(--muted); white-space:nowrap; }
.slot-cells { display:flex; gap:3px; flex:1; flex-wrap:wrap; }
.slot-cell { width:18px; height:18px; min-width:18px; border-radius:4px; border:1px solid #5aa7e8; background:#8ed0ff; display:flex; align-items:center; justify-content:center; }
.slot-cell.used { background:#6b7280; border-color:#4b5563; }
.slot-count { font-size:11px; color:var(--muted); width:36px; text-align:right; white-space:nowrap; }
.slot-legend { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--muted); margin-top:2px; }
.slot-legend .slot-cell { width:12px; height:12px; min-width:12px; }

#toast {
  position:fixed; left:50%; bottom:70px; transform:translateX(-50%) translateY(20px);
  background:rgba(20,24,34,.94); border:1px solid var(--border); color:var(--text);
  padding:8px 16px; border-radius:10px; font-size:13px; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s; z-index:99; max-width:80vw; text-align:center;
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <span class="brand">🐉 DND 跑团台 <em>玩家模式</em></span>
  <span id="conn" class="conn">连接中…</span>
  <span id="campaign" class="campaign"></span>
  <span id="player-box">
    <input id="player-name" placeholder="你的名字" maxlength="24" autocomplete="off">
    <span id="player-hint">绿色＝你的棋子</span>
  </span>
</header>

<main id="layout">
  <aside id="left-panel" class="panel">
    <section class="card">
      <h2>🎲 骰子</h2>
      <div class="dice-grid">
        <button class="die-btn" data-die="d4">d4</button>
        <button class="die-btn" data-die="d6">d6</button>
        <button class="die-btn" data-die="d8">d8</button>
        <button class="die-btn" data-die="d10">d10</button>
        <button class="die-btn" data-die="d12">d12</button>
        <button class="die-btn" data-die="d20">d20</button>
        <button class="die-btn" data-die="d100">d100</button>
      </div>
      <div class="dice-advrow">
        <button class="die-btn" id="dice-adv">⚖️ 优势 d20</button>
        <button class="die-btn" id="dice-dis">⬇ 劣势 d20</button>
      </div>
      <div class="custom-roll">
        <input id="dice-expr" placeholder="如 2d6+3 / 4d8" autocomplete="off">
        <button id="dice-roll">掷!</button>
      </div>
      <div id="dice-result"></div>
      <div id="dice-log"></div>
    </section>

    <section class="card">
      <h2>🖍️ 战术涂鸦</h2>
      <div class="tool-grid">
        <button class="board-tool" data-doodle-tool="pen">✏️ 画笔</button>
        <button class="board-tool" data-doodle-tool="line">📏 直线</button>
        <button class="board-tool" data-doodle-tool="arrow">➡️ 箭头</button>
        <button class="board-tool" data-doodle-tool="circle">⭕ 圆圈</button>
      </div>
      <div class="doodle-colors" id="doodle-colors">
        <button class="doodle-color active" data-color="#ff4d4f" style="background:#ff4d4f" title="红"></button>
        <button class="doodle-color" data-color="#ffd23f" style="background:#ffd23f" title="黄"></button>
        <button class="doodle-color" data-color="#2ecc71" style="background:#2ecc71" title="绿"></button>
        <button class="doodle-color" data-color="#4cc9f0" style="background:#4cc9f0" title="蓝"></button>
        <button class="doodle-color" data-color="#ffffff" style="background:#ffffff" title="白"></button>
        <button class="doodle-color" data-color="#ff8a5c" style="background:#ff8a5c" title="橙"></button>
      </div>
      <div class="doodle-widths">
        <button data-width="3">细</button>
        <button data-width="5" class="active">中</button>
        <button data-width="9">粗</button>
      </div>
      <div class="doodle-actions">
        <button id="doodle-undo">↩ 撤销</button>
        <button id="doodle-clear">🗑 清除</button>
      </div>
      <p class="hint">选好工具后在地图上直接画，画完自动同步给所有人。</p>
    </section>

    <section class="card">
      <h2>📚 常用网站</h2>
      <div id="player-links" class="player-links"></div>
    </section>
  </aside>

  <section id="center">
    <section id="board-wrap">
      <div id="board">
        <div id="world">
          <canvas id="fog-canvas" class="map-layer"></canvas>
          <canvas id="doodle-canvas" class="map-layer"></canvas>
          <div id="tokens"></div>
        </div>
        <div id="empty-hint" class="empty">⏳ 等待主机开团…</div>
        <div id="map-controls">
          <button id="map-zoom-in" title="放大">＋</button>
          <button id="map-zoom-out" title="缩小">－</button>
          <button id="map-fit" title="适应整张地图">⛶</button>
        </div>
      </div>
    </section>
    <section id="init-bar">
      <div class="init-left">
        <span class="init-title">⚔️ 先攻</span>
        <span id="round"></span>
      </div>
      <div id="init-list" class="init-bar-list"></div>
    </section>
  </section>

  <aside id="right-panel" class="panel">
    <section class="card" id="unit-card">
      <h2>🧙 我的棋子</h2>
      <div id="detail" hidden>
        <div class="detail-head">
          <div class="detail-icon" id="detail-icon">🧙</div>
          <div class="detail-title">
            <b id="detail-name"></b>
            <span id="detail-sub" class="detail-sub"></span>
          </div>
          <button id="detail-close" class="menu-close" title="关闭">✕</button>
        </div>
        <div class="sec"><h5>职业</h5><div id="detail-class" class="menu-class"></div></div>
        <div class="sec"><h5>法术环位</h5><div id="detail-spells" class="spell-slots-ui"></div></div>
        <div class="hp-edit">
          <span>生命值</span>
          <input type="number" id="detail-hp-cur" min="0" max="99999">
          <span class="slash">/</span>
          <input type="number" id="detail-hp-max" min="1" max="99999">
          <span id="detail-ac"></span>

function fit() {
  const stage = $('#board');

  if (!m) return;
  const scale = Math.min(stage.clientWidth / m.mapW, stage.clientHeight / m.mapH, 2);
  view.scale = scale;

  view.oy = (stage.clientHeight - m.mapH * scale) / 2;
  world.style.width = m.mapW + 'px';
  world.style.height = m.mapH + 'px';
  applyView();
}

function zoomAt(cx, cy, factor) {
  const rect = world.getBoundingClientRect();
  const wx = (cx - rect.left) / view.scale;
  const wy = (cy - rect.top) / view.scale;
  const ns = clamp(view.scale * factor, 0.2, 4);
  view.ox = view.ox + (cx - rect.left) - wx * ns;
  view.oy = view.oy + (cy - rect.top) - wy * ns;
  view.scale = ns;
  applyView();
}

function drawDoodleStroke(g, s) {
  g.strokeStyle = s.color;
  g.fillStyle = s.color;
  g.lineWidth = s.width;
  g.lineCap = 'round';
  g.lineJoin = 'round';
  if (s.tool === 'pen') {
    if (s.points.length < 2) return;
    g.beginPath();
    g.moveTo(s.points[0].x, s.points[0].y);
    for (let i = 1; i < s.points.length; i++) g.lineTo(s.points[i].x, s.points[i].y);
    g.stroke();
  } else if (s.tool === 'line' || s.tool === 'arrow') {
    g.beginPath();
    g.moveTo(s.x0, s.y0);
    g.lineTo(s.x1, s.y1);
    g.stroke();
    if (s.tool === 'arrow') {
      const a = Math.atan2(s.y1 - s.y0, s.x1 - s.x0);
      const h = Math.max(10, s.width * 2.2);
      g.beginPath();
      g.moveTo(s.x1, s.y1);
      g.lineTo(s.x1 - h * Math.cos(a - Math.PI / 6), s.y1 - h * Math.sin(a - Math.PI / 6));
      g.lineTo(s.x1 - h * Math.cos(a + Math.PI / 6), s.y1 - h * Math.sin(a + Math.PI / 6));
      g.closePath();
      g.fill();
    }
  } else if (s.tool === 'circle') {
    const r = Math.hypot(s.x1 - s.x0, s.y1 - s.y0);
    g.beginPath();
    g.arc(s.x0, s.y0, r, 0, Math.PI * 2);
    g.globalAlpha = 0.15;
    g.fill();
    g.globalAlpha = 1;
    g.stroke();
  }
}

function renderDoodles() {
  doodleCtx2.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
  const m = currentMap;
  if (!m) return;
  (m.doodles || []).forEach((s) => drawDoodleStroke(doodleCtx2, s));
  if (doodleDraft) drawDoodleStroke(doodleCtx2, doodleDraft);
}

function startDoodle(wx, wy) {
  if (doodleTool === 'pen') {
    doodleDraft = { tool: 'pen', color: doodleColor, width: doodleWidth, points: [{ x: wx, y: wy }] };
  } else {
    doodleDraft = { tool: doodleTool, color: doodleColor, width: doodleWidth, x0: wx, y0: wy, x1: wx, y1: wy };
  }
  renderDoodles();
}

function continueDoodle(wx, wy) {
  if (!doodleDraft) return;
  if (doodleDraft.tool === 'pen') {
    const last = doodleDraft.points[doodleDraft.points.length - 1];
    const dx = wx - last.x, dy = wy - last.y;
    const dist = Math.hypot(dx, dy);
    const n = Math.max(1, Math.ceil(dist / 6));
    for (let i = 1; i <= n; i++) doodleDraft.points.push({ x: last.x + dx * i / n, y: last.y + dy * i / n });
  } else {
    doodleDraft.x1 = wx;
    doodleDraft.y1 = wy;
  }
  renderDoodles();
}

function endDoodle() {
  if (!doodleDraft) return;
  const m = currentMap;
  if (m) {
    const isPen = doodleDraft.tool === 'pen';
    const tooShort = !isPen && Math.hypot(doodleDraft.x1 - doodleDraft.x0, doodleDraft.y1 - doodleDraft.y0) <= 4;
    if ((isPen && doodleDraft.points.length >= 2) || (!isPen && !tooShort)) {
      doodleDraft.id = 'pd' + (doodleUid++);
      if (!Array.isArray(m.doodles)) m.doodles = [];
      m.doodles.push(doodleDraft);
      sendDoodles(m);
    }
  }
  doodleDraft = null;
  renderDoodles();
}

function sendDoodles(m) {
  if (!m || !myName) return;
  fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ player: myName, action: { op: 'doodle', mapId: m.id, doodles: m.doodles || [] } }),
  })
    .then((r) => r.json())
    .then((d) => { if (d && d.ok === false) toast('⚠ ' + (d.error || '涂鸦同步失败')); })
    .catch(() => toast('⚠ 涂鸦未同步到服务器'));
}

function worldPoint(ev) {
  const rect = world.getBoundingClientRect();
  return { x: (ev.clientX - rect.left) / view.scale, y: (ev.clientY - rect.top) / view.scale };
}

function snapXY(x, y, grid, size) {
  const sx = size >= 2 ? Math.round(x / grid) * grid : Math.round(x / grid - 0.5) * grid + grid / 2;
  const sy = size >= 2 ? Math.round(y / grid) * grid : Math.round(y / grid - 0.5) * grid + grid / 2;
  return { x: sx, y: sy };
}

let patchDebounce = null;
let pendingPatch = null;
let patchQueue = [];
let patchSending = false;

function flushPatchQueue() {
  if (patchSending || !patchQueue.length) return;
  patchSending = true;
  const item = patchQueue.shift();
  fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ player: myName, action: { op: 'patchToken', tokenId: item.tokenId, patch: item.patch } }),
  })
    .then((r) => r.json())
    .then((d) => { if (d && d.ok === false) toast('⚠ ' + (d.error || '同步失败')); })
    .catch(() => {
      if ((item.retries || 0) < 2) {
        item.retries = (item.retries || 0) + 1;
        patchQueue.unshift(item);
        toast('同步失败，正在重试…');
      } else {
        toast('⚠ 修改未送达，请检查连接');
      }
    })
    .finally(() => { patchSending = false; flushPatchQueue(); });
}

function sendPatch(tokenId, patch, redraw, immediate) {
  if (!myName) return;
  const t = currentMap && currentMap.tokens.find((x) => x.id === tokenId);
  if (!t) return;
  Object.assign(t, patch);
  if (redraw) openTokenPanel(tokenId);
  const push = (p) => {
    const last = patchQueue[patchQueue.length - 1];
    if (last && last.tokenId === tokenId) last.patch = Object.assign(last.patch, p);
    else patchQueue.push({ tokenId, patch: p });
    flushPatchQueue();
  };
  if (immediate) {
    clearTimeout(patchDebounce);
    if (pendingPatch) { push(pendingPatch); pendingPatch = null; }
    push(patch);
    return;
  }
  pendingPatch = Object.assign(pendingPatch || {}, patch);
  clearTimeout(patchDebounce);
  patchDebounce = setTimeout(() => {
    if (pendingPatch) { push(pendingPatch); pendingPatch = null; }
  }, 350);
}

/* ---------- 右侧棋子属性 ---------- */
function abilityMod(v) { return Math.floor((Number(v) - 10) / 2); }
function defaultPlayerSlots() {
  return {
    type: 'normal',
    normal: Array.from({ length: 9 }, (_, i) => ({ level: i + 1, used: 0, max: 0 })),
    none: { used: 0, max: 0 },
    sorcerer: {
      points: { used: 0, max: 0 },
      slots: Array.from({ length: 9 }, (_, i) => ({ level: i + 1, used: 0, max: 0 })),
    },
    warlock: { level: 1, used: 0, max: 0 },
  };
}
function normPlayerSlots(t) {
  const d = defaultPlayerSlots();
  const old = t.spellSlots;
  const num = (v) => Math.max(0, Math.min(99, Number(v) || 0));
  const lvNum = (v) => Math.max(1, Math.min(9, parseInt(v, 10) || 1));
  const copy = (src, dst) => (src || []).forEach((r, i) => {
    if (r && i < dst.length) { dst[i].used = num(r.used); dst[i].max = Math.min(20, num(r.max)); }
  });
  let hasType = false;
  if (Array.isArray(old)) copy(old, d.normal);
  else if (old && typeof old === 'object') {
    hasType = ['normal', 'none', 'sorcerer', 'warlock'].includes(old.type);
    if (hasType) d.type = old.type;
    copy(old.normal, d.normal);
    if (old.none) {
      const n = Array.isArray(old.none) ? old.none[0] : old.none;
      if (n) { d.none.used = num(n.used); d.none.max = Math.min(20, num(n.max)); }
    }
    if (old.sorcerer && typeof old.sorcerer === 'object') {
      if (old.sorcerer.points) { d.sorcerer.points.used = num(old.sorcerer.points.used); d.sorcerer.points.max = Math.min(99, num(old.sorcerer.points.max)); }
      copy(old.sorcerer.slots, d.sorcerer.slots);
    }
    if (Array.isArray(old.warlock)) {
      let pick = null;
      old.warlock.forEach((r, i) => {
        if (r && (r.max > 0 || r.used > 0) && (!pick || i > pick.level - 1)) pick = { level: i + 1, used: r.used, max: r.max };
      });
      if (pick) { d.warlock.level = pick.level; d.warlock.used = num(pick.used); d.warlock.max = Math.min(20, num(pick.max)); }
  } else if (old.warlock && typeof old.warlock === 'object') {
      d.warlock.level = lvNum(old.warlock.level);
      d.warlock.used = num(old.warlock.used);
      d.warlock.max = Math.min(20, num(old.warlock.max));
    }
    if (!hasType) {
      if (d.none.max > 0 || d.none.used > 0) d.type = 'none';
      else if (d.sorcerer.points.max > 0 || d.sorcerer.points.used > 0 || d.sorcerer.slots.some((r) => r.max > 0 || r.used > 0)) d.type = 'sorcerer';
      else if (d.warlock.max > 0 || d.warlock.used > 0) d.type = 'warlock';
    }
  }
  if (t.className && t.className !== '无职业') d.type = effectiveSlotType(t);
  return d;
}
function playerAC(t) {
  const dexMod = abilityMod(t.stats && t.stats.dex);
  const armor = (t.equipment || []).find((e) => e.type === 'armor');
  let ac = armor ? armor.baseAC : 10 + Math.max(0, dexMod);
  if (armor) {
    if (armor.dexCap === 0) ac = armor.baseAC;
    else if (armor.dexCap === 2) ac = armor.baseAC + Math.min(2, Math.max(0, dexMod));
    else ac = armor.baseAC + Math.max(0, dexMod);
  }
  (t.equipment || []).forEach((e) => { if (e.type === 'shield' || e.type === 'other') ac += (e.acBonus || 0); });
  return ac;
}
function playerInit(t) { return (t.initBonus || 0) + abilityMod(t.stats && t.stats.dex); }
function refreshDetailHeader(t) {
  if (!t) return;
  const typeName = ({ pc:'玩家角色', enemy:'敌人', npc:'中立NPC', ally:'友好NPC' })[t.type] || '';
  const clsName = t.className && CLASS_META[t.className] ? t.className : '无职业';
  const initV = playerInit(t);
  $('#detail-sub').textContent = `${typeName} · ${clsName}${t.subClassName ? ' · ' + t.subClassName : ''} · AC ${playerAC(t)} · 先攻 ${initV >= 0 ? '+' : ''}${initV}`;
  $('#detail-ac').textContent = 'AC ' + playerAC(t);
}
function syncHpBar(t) {
  if (!t) return;
  const hp = Math.max(0, Number(t.hp) || 0);
  const hpMax = Math.max(1, Number(t.hpMax) || 1);
  const pct = Math.min(100, Math.round((hp / hpMax) * 100));
  $('#detail-hp-cur').value = hp;
  $('#detail-hp-max').value = hpMax;
  const bar = $('#detail-hpbar');
  bar.style.width = pct + '%';

}
function findPlayerSpellRow(t, sec, level) {
  if (!t.spellSlots) return null;
  if (sec === 'normal') return (t.spellSlots.normal || []).find((r) => String(r.level) === String(level));
  if (sec === 'none') return t.spellSlots.none;
  if (sec === 'sorcerer') {
    return level === 'points' ? t.spellSlots.sorcerer.points
      : (t.spellSlots.sorcerer.slots || []).find((r) => String(r.level) === String(level));
  }
  if (sec === 'warlock') return t.spellSlots.warlock;
  return null;
}

function playerToggleRow(row, idx, action) {
  const max = row.max || 0;
  if (action === 'plus') { row.max = Math.min(20, max + 1); return; }
  if (action === 'minus') {
    row.max = Math.max(0, max - 1);
    if ((row.used || 0) > row.max) row.used = row.max;
    return;
  }
  const rem = Math.max(0, max - (row.used || 0));
  row.used = idx < rem ? max - idx : max - (idx + 1);
}

function playerSetResource(tokenId, key, idx, action) {
  const t = currentMap && currentMap.tokens.find((x) => x.id === tokenId);
  if (!t) return;
  const def = classResourceDefs(t).find((x) => x.key === key);
  if (!def) return;
  t.classResources = t.classResources || {};
  const cur = t.classResources[key] || (t.classResources[key] = { used: 0, max: def.max });
  playerToggleRow(cur, idx, action);
  sendPatch(tokenId, { classResources: JSON.parse(JSON.stringify(t.classResources)) }, true, true);
}

function playerSetSpell(tokenId, sec, level, idx, action) {
  const t = currentMap && currentMap.tokens.find((x) => x.id === tokenId);
  if (!t) return;
  const row = findPlayerSpellRow(t, sec, level);
  if (!row) return;
  playerToggleRow(row, idx, action);
  sendPatch(tokenId, { spellSlots: JSON.parse(JSON.stringify(t.spellSlots)) }, true, true);
}

function renderPlayerHitDice(t) {
  const box = $('#player-hitdice');
  if (!box) return;
  const hd = t.hitDice || { die: classDef(t).hitDie || 8, max: t.level || 1, used: 0 };
  if (classDef(t).hitDie) hd.die = classDef(t).hitDie;
  if ((hd.max || 0) !== (t.level || 1)) hd.max = t.level || 1;
  if (!t.hitDice) t.hitDice = hd;
  const max = Math.max(0, hd.max || 0);
  const rem = Math.max(0, max - (hd.used || 0));
  box.innerHTML = '';
  const label = document.createElement('span');
  label.className = 'hd-label';
  label.textContent = `生命骰 d${hd.die || 8}`;
  const cells = document.createElement('div');
  cells.className = 'slot-cells';
  for (let i = 0; i < max; i++) {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'slot-cell' + (i >= rem ? ' used' : '');
    c.title = '点击切换已用生命骰';
    c.addEventListener('click', () => {
      const m = hd.max || 0;
      const r = Math.max(0, m - (hd.used || 0));
      hd.used = i < r ? m - i : m - (i + 1);
      sendPatch(t.id, { hitDice: JSON.parse(JSON.stringify(hd)) }, true, true);
    });
    cells.appendChild(c);
  }
  const count = document.createElement('span');
  count.className = 'slot-count';
  count.textContent = `${rem}/${max}`;
  const roll = document.createElement('button');
  roll.type = 'button';
  roll.className = 'hd-roll';
  roll.textContent = '🎲 掷1颗';
  roll.title = `掷 d${hd.die || 8} + 体质调整，恢复生命并消耗 1 颗`;
  roll.addEventListener('click', () => playerRollHitDie(t, hd));
  const full = document.createElement('button');
  full.type = 'button';
  full.className = 'hd-full';
  full.textContent = '恢复全部';
  full.title = '长休后恢复所有生命骰';
  full.addEventListener('click', () => {
    hd.used = 0;
    sendPatch(t.id, { hitDice: JSON.parse(JSON.stringify(hd)) }, true, true);
  });
  box.append(label, cells, count, roll, full);
}

function playerRollHitDie(t, hd) {
  const rem = Math.max(0, (hd.max || 0) - (hd.used || 0));
  if (rem <= 0) { toast('没有剩余生命骰，长休后才能恢复'); return; }
  const die = hd.die || 8;
  const roll = 1 + Math.floor(Math.random() * die);
  const con = Math.max(0, abilityMod(t.stats && t.stats.con));
  const heal = roll + con;
  t.hp = Math.min(t.hpMax || t.hp, (t.hp || 0) + heal);
  hd.used = Math.min(hd.max || 0, (hd.used || 0) + 1);
  sendPatch(t.id, { hitDice: JSON.parse(JSON.stringify(hd)), hp: t.hp }, true, true);
}

/* ---------- 骰子 ---------- */
function parseExpr(expr) {
  const m = expr.trim().toLowerCase().match(/^(\d*)d(\d+)([+-]\d+)?$/);
  if (!m) return null;
  const count = m[1] ? parseInt(m[1], 10) : 1;
  const sides = parseInt(m[2], 10);
  const mod = m[3] ? parseInt(m[3], 10) : 0;
  if (count < 1 || count > 100 || sides < 2 || sides > 1000) return null;
  return { count, sides, mod, label: expr.trim() };
}
function rollSet(count, sides) { return Array.from({ length: count }, () => 1 + Math.floor(Math.random() * sides)); }
function addDiceLine(who, expr, detail, total) {
  const box = $('#dice-log');
  const div = document.createElement('div');
  div.className = 'roll-line';
  div.innerHTML = `<span class="roll-who">${esc(who)}</span><span class="roll-expr">${esc(expr)}</span><span class="roll-detail">${esc(detail)}</span><span class="roll-total">${total}</span>`;
  box.prepend(div);
  while (box.children.length > 30) box.lastChild.remove();
}
function playDiceFx(sides, label, total, opts) {
  if (window.playDieAnimation) window.playDieAnimation(sides, label, total, opts);
}
function rollAndSend(expr, mode) {
  const parsed = parseExpr(expr);
  if (!parsed) { toast('无法识别的骰子表达式，示例：2d6+3'); return; }
  let chosen = rollSet(parsed.count, parsed.sides);
  const first = chosen;
  let note = '';
  let other = null;
  let pickedFirst = null;
  if (mode !== 0 && parsed.sides === 20) {
    const second = rollSet(parsed.count, parsed.sides);
    const sumA = first.reduce((a, b) => a + b, 0);
    const sumB = second.reduce((a, b) => a + b, 0);
    const pickMax = mode === 1;
    pickedFirst = pickMax ? sumA >= sumB : sumA <= sumB;
    chosen = pickedFirst ? first : second;
    other = pickedFirst ? second : first;
    note = `（两次 ${sumA} / ${sumB}，取${pickMax ? '大' : '小'}）`;
  }
  const sum = chosen.reduce((a, b) => a + b, 0) + parsed.mod;
  const label = parsed.label + (mode === 1 ? '⚖️优势' : mode === -1 ? '⬇️劣势' : '');
  const detail = chosen.join(' + ') + (parsed.mod ? (parsed.mod > 0 ? ` + ${parsed.mod}` : ` ${parsed.mod}`) : '') + note;
  const who = myName || '我';
  const rid = 'r' + Date.now() + Math.random().toString(36).slice(2, 8);
  const dicePayload = other ? [chosen[0], other[0]] : chosen.slice();
  const pickPayload = pickedFirst === null ? undefined : (pickedFirst ? 0 : 1);
  playDiceFx(parsed.sides, label, sum, { dice: dicePayload, pick: pickPayload, mode });
  const resEl = $('#dice-result');
  resEl.className = 'rolling';
  resEl.textContent = '🎲 掷骰中…';
  setTimeout(() => { resEl.className = ''; resEl.textContent = `${label} → ${sum}`; }, 600);
  localRids.add(rid);
  if (localRids.size > 20) localRids.delete(localRids.values().next().value);
  addDiceLine(who, label, detail, sum);
  fetch('/api/action', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ player: myName || '玩家', action: { op: 'roll', rid, name: who, expr: label, detail, total: sum, sides: parsed.sides, dice: dicePayload, pick: pickPayload, mode } }),
  })
    .then((r) => r.json())
    .then((d) => { if (d && d.ok === false) toast('⚠ ' + (d.error || '掷骰同步失败')); })
    .catch(() => toast('⚠ 掷骰未同步到服务器，其他玩家看不到'));
}

/* ---------- 指针交互 ---------- */
const board = $('#board');
board.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (e.target.closest('button')) return;
  if (!currentMap) return;
  const w = worldPoint(e);
  if (doodleTool) {
    startDoodle(w.x, w.y);
    drag = { mode: 'doodle' };
    board.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  const tokenEl = e.target.closest('.token.mine');
  if (!tokenEl) {
    drag = { mode: 'pan', startX: e.clientX, startY: e.clientY, ox: view.ox, oy: view.oy };
    board.setPointerCapture(e.pointerId);
    e.preventDefault();
    return;
  }
  const riderEl = e.target.closest('.rider');
  const t = currentMap.tokens.find((x) => x.id === tokenEl.dataset.id);
  if (!t) return;
  drag = {
    mode: 'token',
    tokenId: t.id,
    mapId: currentMap.id,
    el: tokenEl,
    menuId: riderEl ? riderEl.dataset.id : t.id,
    startClientX: e.clientX,
    startClientY: e.clientY,
    grid: currentMap.gridSize || 50,
    size: t.size || 1,
    moved: false,
    lastSend: 0,
  };
  tokenEl.setPointerCapture(e.pointerId);
  tokenEl.classList.add('dragging');
  e.preventDefault();
});

board.addEventListener('pointermove', (e) => {
  if (!drag || !currentMap) return;
  if (drag.mode === 'pan') {
    view.ox = drag.ox + (e.clientX - drag.startX);
    view.oy = drag.oy + (e.clientY - drag.startY);
    applyView();
    return;
  }
  if (drag.mode === 'doodle') {
    const w = worldPoint(e);
    continueDoodle(w.x, w.y);
    return;
  }
  const p = worldPoint(e);
  const sp = lastState && lastState.snap === false ? p : snapXY(p.x, p.y, drag.grid, drag.size);
  const margin = drag.size >= 2 ? drag.grid : drag.grid / 2;
  const cx = clamp(sp.x, margin, currentMap.mapW - margin);
  const cy = clamp(sp.y, margin, currentMap.mapH - margin);
  drag.el.style.left = cx + 'px';
  drag.el.style.top = cy + 'px';
  const t = currentMap.tokens.find((x) => x.id === drag.tokenId);
  if (t) {
    t.x = cx;
    t.y = cy;
    if (t.size >= 2) currentMap.tokens.forEach((r) => { if (r.mountId === t.id) { r.x = cx; r.y = cy; } });
  }
  if (Math.hypot(e.clientX - drag.startClientX, e.clientY - drag.startClientY) > 4) drag.moved = true;
  const now = Date.now();
  if (drag.moved && now - drag.lastSend >= 250) { drag.lastSend = now; sendMove(drag); }
});

board.addEventListener('pointerup', (e) => {
  if (!drag) return;
  if (drag.mode === 'doodle') { endDoodle(); drag = null; return; }
  const wasMoved = drag.moved;
  const menuId = drag.menuId;
  if (drag.el && drag.el.classList) drag.el.classList.remove('dragging');
  if (wasMoved) sendMove(drag);
  drag = null;
  if (!wasMoved && menuId) openTokenPanel(menuId);
});

board.addEventListener('pointercancel', () => {
  if (!drag) return;
  if (drag.mode === 'doodle') { doodleDraft = null; renderDoodles(); }
  if (drag.el && drag.el.classList) drag.el.classList.remove('dragging');
  drag = null;
});

/* ---------- 远端动作 ---------- */
function applyRemoteAction(a) {
  if (!a) return;
  if (a.op === 'roll') {
    if (a.rid && localRids.has(a.rid)) { localRids.delete(a.rid); return; }
    playDiceFx(a.sides || 20, a.expr || '', a.total, { dice: a.dice, pick: a.pick, mode: a.mode });
    addDiceLine(a.name || '玩家', a.expr || '', a.detail || '', a.total);
    return;
  }
  if (a.op === 'doodle') {
    if (currentMap && a.mapId === currentMap.id && Array.isArray(a.doodles)) {
      currentMap.doodles = a.doodles;
      renderDoodles();
    }
    return;
  }
  if (!lastState || !a.tokenId) return;
  const m = (lastState.maps || []).find((x) => x.id === (a.mapId || (currentMap && currentMap.id)));
  if (!m) return;
  const t = m.tokens.find((x) => x.id === a.tokenId);
  if (!t) return;
  if (a.op === 'moveToken') {
    t.x = a.x;
    t.y = a.y;
    if ((t.size || 1) >= 2) m.tokens.forEach((r) => { if (r.mountId === t.id) { r.x = a.x; r.y = a.y; } });
    if (currentMap && currentMap.id === m.id) {
      const el = document.querySelector(`.token[data-id="${t.id}"]`);
      if (el) { el.style.left = t.x + 'px'; el.style.top = t.y + 'px'; }
    }
  } else if (a.op === 'setStatus') {
    const sts = Array.isArray(t.statuses) ? t.statuses : [];
    t.statuses = sts.filter((k) => k !== a.status);
    if (a.on) t.statuses.push(a.status);
    if (currentMap && currentMap.id === m.id) renderTokens(m);
    if (selectedTokenId === t.id) openTokenPanel(t.id);
  }
}

const playerAudio = new Audio();
let bgmPendingPlay = false;
let bgmCurrentUrl = '';
let bgmUnlockBound = false;

function askBgmUnlock() {
  toast('🔇 浏览器阻止自动播放，点击页面任意处开始听 BGM');
  if (bgmUnlockBound) return;
  bgmUnlockBound = true;
  const unlock = () => {
    if (bgmPendingPlay) { playerAudio.play().catch(() => {}); bgmPendingPlay = false; }
    bgmUnlockBound = false;
    document.removeEventListener('click', unlock);
  };
  document.addEventListener('click', unlock);
}

function applyBgmAction(a) {
  if (!a) return;
  if (a.action === 'play') {
    if (a.url && a.url !== bgmCurrentUrl) {
      bgmCurrentUrl = a.url;
      playerAudio.src = a.url;
      playerAudio.currentTime = a.time || 0;
      bgmPendingPlay = true;
      playerAudio.play().then(() => { bgmPendingPlay = false; }).catch(() => askBgmUnlock());
    } else {
      if (a.time !== undefined && Math.abs((playerAudio.currentTime || 0) - a.time) > 2) playerAudio.currentTime = a.time;
      if (playerAudio.paused) {
        bgmPendingPlay = true;
        playerAudio.play().then(() => { bgmPendingPlay = false; }).catch(() => askBgmUnlock());
      }
    }
  } else if (a.action === 'pause' || a.action === 'stop') {
    playerAudio.pause();
    bgmPendingPlay = false;
  }
}

const es = new EventSource('/api/events');
es.onopen = () => { $('#conn').textContent = '已连接'; $('#conn').classList.add('on'); };
es.onerror = () => { $('#conn').textContent = '连接中断，重连中…'; $('#conn').classList.remove('on'); };
es.onmessage = (e) => {
  try {
    const ev = JSON.parse(e.data);
    if (ev.type === 'state') render(ev.state);
    else if (ev.type === 'action') {
      if (ev.action && ev.action.op === 'bgm') { applyBgmAction(ev.action); return; }
      applyRemoteAction(ev.action);
    }
  } catch (err) { /* 忽略坏数据 */ }
};
window.addEventListener('resize', fit);
</script>
