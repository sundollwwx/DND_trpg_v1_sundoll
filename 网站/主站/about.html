    <div class="about-content wrap"><div class="about-layout"><p class="eyebrow">ABOUT SUNDOLL</p><h1>那个晴天</h1><div class="about-prose">
      <p>「桑哆尔」是 Sundoll 的中文谐音，取意于晴天娃娃，以纪念本人高中时的一段美好的记忆。</p>
      <p>上午下了小雨，我用纸做了一个晴天娃娃，祈祷下午放晴可以上体育课去打球，足够幸运啊，算是得偿所愿。</p>
      <p>那只纸娃娃，我把它高高地贴挂在教室后门上面，坚持了约莫一个暑假吧，在步入秋天之际被我的班主任摘了下来。</p>
